<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Halloween · Déjà Vu</title>
<!--
  Grafiche di Halloween. Un solo file per tutti i formati, scelti con l'indirizzo:
    grafiche.html#locandina   vetrina A3
    grafiche.html#post        Instagram 1080×1350
    grafiche.html#storia      Instagram storia 1080×1920
    grafiche.html#menu        menu da tavolo A5 (stampabile)
  Data, orario e menu si cambiano in EVENTO, qui sotto nello script.
-->
<style>
  @font-face { font-family: "Creepster"; src: url("font/creepster.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; src: url("font/montserrat-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Montserrat"; src: url("font/montserrat-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Montserrat"; src: url("font/montserrat-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Montserrat"; src: url("font/montserrat-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Montserrat"; src: url("font/montserrat-800.woff2") format("woff2"); font-weight: 800; }
  @font-face { font-family: "Montserrat"; src: url("font/montserrat-900.woff2") format("woff2"); font-weight: 900; }

  :root {
    --notte: #0d0416;
    --viola-scuro: #22093a;
    --viola: #4a1466;
    --zucca: #ff7518;
    --zucca-chiaro: #ffb347;
    --veleno: #8fe34a;
    --luna: #fff1c4;
    --osso: #f5ecdc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: #111; }
  body { font-family: "Montserrat", system-ui, sans-serif; color: var(--osso); -webkit-font-smoothing: antialiased; }

  .tela {
    position: relative; overflow: hidden; margin: 0 auto;
    background:
      radial-gradient(ellipse 80% 45% at 50% 100%, rgba(255,117,24,.35), transparent 70%),
      linear-gradient(180deg, var(--notte) 0%, var(--viola-scuro) 45%, var(--viola) 80%, #5a1a5a 100%);
  }
  .luna { position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #fffbe8, var(--luna) 55%, #e8d49a 100%); box-shadow: 0 0 80px 30px rgba(255,241,196,.25); }
  .luna::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background:
      radial-gradient(circle at 30% 60%, rgba(200,180,120,.35) 0 8%, transparent 9%),
      radial-gradient(circle at 62% 30%, rgba(200,180,120,.3) 0 6%, transparent 7%),
      radial-gradient(circle at 70% 70%, rgba(200,180,120,.25) 0 10%, transparent 11%); }
  .stelle { position: absolute; inset: 0; opacity: .6; }
  .stelle svg { width: 100%; height: 100%; }

  /* logo del bar grande in alto: si deve vedere che la serata è del Déjà Vu */
  .presenta { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .35em; letter-spacing: .4em; text-transform: uppercase; font-weight: 700; color: var(--zucca-chiaro); }
  .presenta img { height: 9.5em; width: auto; filter: drop-shadow(0 0 .8em rgba(0,0,0,.6)); }
  .titolo { text-align: center; font-family: "Creepster", cursive; line-height: .9; }
  .titolo .hal { display: block; color: var(--zucca); letter-spacing: .04em; text-shadow: 0 0 .25em rgba(255,117,24,.55), .04em .05em 0 #000; }
  .notte { text-align: center; font-family: "Creepster", cursive; color: var(--veleno); letter-spacing: .06em; text-shadow: .04em .04em 0 #000; }
  .costume { display: inline-block; background: rgba(13,4,22,.7); border: .1em solid var(--zucca); border-radius: 999px; padding: .45em 1.1em; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--osso); }

  .drink-top { display: flex; justify-content: center; gap: .9em; flex-wrap: wrap; }
  .drink-top div {
    background: rgba(13,4,22,.65); border: .1em solid var(--veleno); border-radius: 999px; color: var(--osso);
    padding: .5em 1.2em; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap;
  }
  .cibo-top { text-align: center; font-weight: 600; letter-spacing: .04em; }
  .cibo-top b { color: var(--zucca-chiaro); }
  .data {
    text-align: center; color: var(--notte); font-weight: 900; text-transform: uppercase; letter-spacing: .14em;
    background: linear-gradient(180deg, var(--zucca-chiaro), var(--zucca)); border-radius: .3em; padding: .45em 1.5em;
    box-shadow: 0 0 1em rgba(255,117,24,.5);
  }
  .data small { display: block; font-weight: 700; letter-spacing: .2em; font-size: .55em; margin-top: .15em; }
  .piede { text-align: center; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--zucca-chiaro); }
  .piede b { color: var(--osso); }

  .decoro { position: absolute; pointer-events: none; }
  .decoro svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* ---------------- formati ---------------- */
  .locandina { width: 1123px; height: 1587px; font-size: 26px; }
  .post { width: 1080px; height: 1350px; font-size: 24px; }
  .storia { width: 1080px; height: 1920px; font-size: 29px; }
  .colonna { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9em; padding: 5em 2.4em 6em; }
  .storia .colonna { justify-content: space-evenly; gap: 0; padding: 7em 1.6em 8em; }
  .post .colonna { gap: .65em; padding-top: 4em; padding-bottom: 5.5em; }
  .post .presenta img { height: 8em; }
  .titolo .hal { font-size: 7.2em; }
  .storia .titolo .hal { font-size: 6.6em; }
  .notte { font-size: 2.2em; }
  .data { font-size: 1.6em; }

  /* ---------------- menu da tavolo A5 ---------------- */
  .menu { width: 148mm; height: 210mm; font-size: 9.4pt; background: var(--osso); color: #1e0b2a; }
  .menu .testa {
    position: relative; height: 60mm; overflow: hidden; color: var(--osso);
    background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(255,117,24,.35), transparent 70%), linear-gradient(180deg, var(--notte), var(--viola-scuro) 50%, var(--viola));
    border-bottom: 1.4mm solid var(--zucca);
  }
  .menu .testa .colonna { padding: 6mm 6mm 2mm; gap: 1mm; justify-content: flex-start; }
  .menu .presenta { font-size: 6.5pt; gap: .6mm; }
  .menu .presenta img { height: 21mm; }
  .menu .titolo .hal { font-size: 34pt; }
  .menu .sotto { font-size: 6.6pt; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--zucca-chiaro); margin-top: 1mm; }
  .menu .corpo { padding: 3mm 10mm 0; }
  .menu h2 {
    font-family: "Creepster", cursive; font-weight: 400; font-size: 15pt; color: var(--viola); letter-spacing: .05em;
    display: flex; align-items: center; gap: 3mm; margin: 3.8mm 0 .6mm;
  }
  .menu h2::after { content: ""; flex: 1; height: .45mm; background: linear-gradient(90deg, var(--zucca), rgba(255,117,24,.15)); }
  .menu .voce { display: grid; grid-template-columns: 1fr auto; column-gap: 3mm; padding: 1.3mm 0; }
  .menu .voce .n { font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 9pt; }
  .menu .voce .p { font-weight: 800; color: #c24f00; font-size: 9.5pt; }
  .menu .voce .d { grid-column: 1 / -1; font-size: 7.3pt; color: #5d4a66; line-height: 1.3; margin-top: .2mm; }
  .menu .combo {
    margin: 3mm 0 0; background: var(--viola-scuro); color: var(--zucca-chiaro); border: .5mm solid var(--zucca); border-radius: 2mm; padding: 2mm 3.5mm;
    display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 8.6pt;
  }
  .menu .combo span { font-weight: 600; font-size: 7.4pt; color: var(--osso); }
  .menu .regalo { text-align: center; margin-top: 2.2mm; font-size: 8pt; font-weight: 700; color: var(--viola); }
  .menu .note { text-align: center; font-size: 6.4pt; color: #7d6a85; margin-top: 1.2mm; line-height: 1.35; }
  .menu .piede { position: absolute; left: 0; right: 0; bottom: 3.5mm; font-size: 6.2pt; color: var(--viola-scuro); }
  .menu .piede b { color: #c24f00; }

  @media print { html, body { background: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- zucca intagliata -->
    <symbol id="zucca" viewBox="0 0 140 130">
      <path d="M66 20c-2-10 2-18 10-20l4 4c-6 2-8 8-6 16z" fill="#3f6b2a"/>
      <ellipse cx="40" cy="74" rx="34" ry="50" fill="#e8620f"/>
      <ellipse cx="100" cy="74" rx="34" ry="50" fill="#e8620f"/>
      <ellipse cx="70" cy="74" rx="38" ry="54" fill="#ff7518"/>
      <g fill="#ffd54a">
        <path d="M44 58l14 14H34zM96 58l10 14H82z"/>
        <path d="M66 80l4 8 4-8z"/>
        <path d="M34 92c10 14 62 14 72 0-6 16-18 22-36 22s-30-6-36-22zm14 6v8l6-6zm18 2v10l6-8zm18-2v8l6-8z"/>
      </g>
    </symbol>
    <!-- pipistrello -->
    <symbol id="pipistrello" viewBox="0 0 120 50">
      <path d="M60 18c-4-8-4-12 0-16 1 4 3 6 0 0 3 6 5 4 6 0 4 4 4 8 0 16 10-10 28-18 54-14-10 4-14 10-14 18-8-6-18-4-22 6-6-8-16-6-20 4-2-8-6-12-4-14zM60 18c-4 4-6 12-4 14" fill="#0d0416"/>
      <path d="M60 18c-10-10-28-18-54-14 10 4 14 10 14 18 8-6 18-4 22 6 6-8 16-6 18 4z" fill="#0d0416"/>
      <ellipse cx="60" cy="22" rx="7" ry="10" fill="#0d0416"/>
    </symbol>
    <!-- ragnatela d'angolo -->
    <symbol id="ragnatela" viewBox="0 0 200 200">
      <g fill="none" stroke="rgba(245,236,220,.55)" stroke-width="2">
        <path d="M0 0L200 200M0 0L200 70M0 0L70 200M0 0L200 0M0 0L0 200"/>
        <path d="M0 50Q30 40 40 40Q42 30 50 0"/><path d="M0 100Q60 80 75 75Q85 55 100 0"/>
        <path d="M0 150Q90 120 110 110Q125 80 150 0"/><path d="M0 200Q120 165 145 145Q165 105 200 0"/>
      </g>
      <line x1="120" y1="0" x2="120" y2="70" stroke="rgba(245,236,220,.55)" stroke-width="1.5"/>
      <g fill="#0d0416"><ellipse cx="120" cy="78" rx="9" ry="11"/><circle cx="120" cy="64" r="6"/>
        <path d="M112 74l-14-8M112 80l-16 0M112 86l-14 8M128 74l14-8M128 80l16 0M128 86l14 8" stroke="#0d0416" stroke-width="3"/></g>
    </symbol>
    <pattern id="tramastelle" width="160" height="160" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="1.8" fill="#fff"/><circle cx="110" cy="18" r="1.2" fill="#fff"/><circle cx="70" cy="90" r="1.5" fill="#fff"/>
      <circle cx="140" cy="120" r="1.8" fill="#fff"/><circle cx="35" cy="140" r="1" fill="#fff"/>
    </pattern>
  </defs>
</svg>
<div id="root"></div>

<script>
/* =================== DA CAMBIARE QUI =================== */
const EVENTO = {
  data: "Sabato 30 ottobre",
  orario: "",            // es. "dalle 19:00"
  luogo: "Via Borgo Santa Caterina 24a · Bergamo",
  instagram: "@dejavu.bergamo",
};
const DRINK = [
  { n: "Pozione Nera", p: 10, d: "Vodka e liquore al caffè, con gocce di «sangue» di Angostura." },
  { n: "Zombie", p: 10, d: "Rum chiaro e scuro, lime e lampone: il cocktail che resuscita i morti." },
  { n: "Strega Verde", p: 10, d: "Gin, Chartreuse e lime. Verde veleno." },
  { n: "Zucca Spritz", p: 8, d: "Rabarbaro Zucca, Prosecco e soda: la zucca di Halloween, nel bicchiere." },
  { n: "Shot del Vampiro", p: 4, d: "Ancho Reyes e lampone: rosso sangue e piccante." },
];
const CIBO = [
  { n: "Mummie", p: 7, d: "Würstel avvolti nella pasta sfoglia, con occhi di senape e ketchup." },
  { n: "Pizzette ragno", p: 6, d: "6 pizzette con ragni di olive nere." },
  { n: "Crostone zucca e Branzi", p: 8, d: "Pane malfatto con zucca arrosto e Branzi fuso." },
];
const COMBO = { n: "Combo Brivido", d: "un cocktail della serata + Mummie", p: 15 };
const PREMIO = "🏆 Premio al costume più spaventoso";
/* ======================================================= */

const formato = (location.hash.slice(1) || "locandina");
const euro = (p) => (Number.isInteger(p) ? p : p.toFixed(2).replace(".", ",")) + " €";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const deco = (id, css) => `<div class="decoro" style="${css}"><svg><use href="#${id}"/></svg></div>`;
const stelle = `<div class="stelle"><svg><rect width="100%" height="100%" fill="url(#tramastelle)"/></svg></div>`;

function grafica(cls) {
  const W = { locandina: 1123, post: 1080, storia: 1080 }[cls];
  const H = { locandina: 1587, post: 1350, storia: 1920 }[cls];
  const L = W * .42;
  const data = EVENTO.data ? `<div class="data">${esc(EVENTO.data)}${EVENTO.orario ? `<small>${esc(EVENTO.orario)}</small>` : ""}</div>` : `<div class="data">Data in arrivo</div>`;
  return `<div class="tela ${cls}">
    ${stelle}
    <div class="luna" style="width:${L}px;height:${L}px;right:-${L * .18}px;top:-${L * .15}px"></div>
    ${deco("ragnatela", `width:${W * .26}px;height:${W * .26}px;left:0;top:0`)}
    ${deco("pipistrello", `width:${W * .16}px;height:${W * .067}px;right:${W * .2}px;top:${H * .1}px;transform:rotate(-10deg)`)}
    ${deco("pipistrello", `width:${W * .1}px;height:${W * .042}px;right:${W * .06}px;top:${H * .2}px;transform:rotate(12deg)`)}
    ${deco("pipistrello", `width:${W * .08}px;height:${W * .034}px;left:${W * .12}px;top:${H * .24}px;transform:rotate(-6deg)`)}
    ${deco("zucca", `width:${W * .2}px;height:${W * .186}px;left:${W * .02}px;bottom:${H * .015}px`)}
    ${deco("zucca", `width:${W * .15}px;height:${W * .14}px;right:${W * .03}px;bottom:${H * .015}px`)}
    <div class="colonna">
      <div class="presenta"><img src="logo.png" alt="Déjà Vu"><span>presenta</span></div>
      <div class="titolo"><span class="hal">HALLOWEEN</span></div>
      <div class="notte">Notte da brividi</div>
      <div class="costume">${esc(PREMIO)}</div>
      <div class="drink-top">${DRINK.slice(0, 3).map((d) => `<div>${esc(d.n)}</div>`).join("")}</div>
      <div class="cibo-top"><b>Mummie</b> · <b>Pizzette ragno</b> · <b>Crostone zucca e Branzi</b></div>
      ${data}
      <div class="piede">Déjà Vu · ${esc(EVENTO.luogo)}<br><b>${esc(EVENTO.instagram)}</b></div>
    </div>
  </div>`;
}

function menu() {
  const voce = (x) => `<div class="voce"><span class="n">${esc(x.n)}</span><span class="p">${euro(x.p)}</span><span class="d">${esc(x.d)}</span></div>`;
  return `<div class="tela menu" style="background:var(--osso)">
    <div class="testa">
      ${stelle}
      ${deco("ragnatela", "width:26mm;height:26mm;left:0;top:0")}
      ${deco("pipistrello", "width:16mm;height:6.7mm;right:10mm;top:8mm;transform:rotate(-10deg)")}
      ${deco("zucca", "width:16mm;height:15mm;left:8mm;bottom:3mm")}
      ${deco("zucca", "width:14mm;height:13mm;right:8mm;bottom:3mm")}
      <div class="colonna">
        <div class="presenta"><img src="logo.png" alt="Déjà Vu"><span>presenta</span></div>
        <div class="titolo"><span class="hal">HALLOWEEN</span></div>
        <div class="sotto">${esc(EVENTO.data)} · Notte da brividi</div>
      </div>
    </div>
    <div class="corpo">
      <h2>Pozioni</h2>
      ${DRINK.map(voce).join("")}
      <h2>Da mangiare</h2>
      ${CIBO.map(voce).join("")}
      <div class="combo">${esc(COMBO.n)} <span>${esc(COMBO.d)}</span> ${euro(COMBO.p)}</div>
      <div class="regalo">${esc(PREMIO)}</div>
      <div class="note">Per allergie e intolleranze chiedi al personale.</div>
    </div>
    <div class="piede">Déjà Vu · ${esc(EVENTO.luogo)} · <b>${esc(EVENTO.instagram)}</b></div>
  </div>`;
}

document.head.insertAdjacentHTML("beforeend", `<style>@page { size: ${formato === "menu" ? "148mm 210mm" : "297mm 420mm"}; margin: 0; }</style>`);
document.getElementById("root").innerHTML = formato === "menu" ? menu() : grafica(formato);
</script>
</body>
</html>
