<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Déjà Vu · Staff</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Déjà Vu Staff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="../shared/brand.css">
<style>
  :root {
    --bg: var(--dv-black);
    --panel: var(--dv-panel);
    --panel-2: var(--dv-panel-2);
    --line: var(--dv-line);
    --line-2: var(--dv-line-2);
    --text: var(--dv-white);
    --muted: var(--dv-muted);
    --accent: var(--dv-tq);
    --danger: var(--dv-red);
    --radius: 12px;
    --top-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--text); }
  body {
    font-family: var(--dv-sans); font-size: 15px; min-height: 100vh;
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; }
  ::placeholder { color: var(--muted); opacity: .8; }
  h2, h3 { font-family: var(--dv-serif); font-weight: 600; letter-spacing: .01em; }

  /* ---------- Testata ---------- */
  .top {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,11,.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 8px) 20px 8px;
    display: flex; align-items: center; gap: 16px;
  }
  body.home .top { display: none; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .brand img { width: 46px; height: 46px; }
  .brand span { color: var(--muted); }
  .tabs { margin-left: auto; display: flex; gap: 4px; }
  .tabs a {
    text-decoration: none; color: var(--muted); padding: 12px 16px; position: relative;
    text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 600;
  }
  .tabs a.on { color: var(--text); }
  .tabs a.on::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: 4px; height: 2px; background: var(--accent); }
  @media (max-width: 1180px) {
    .tabs a { padding: 12px 10px; letter-spacing: .1em; }
    .tabs a.on::after { left: 10px; right: 10px; }
    .top .agg-btn .tx { display: none; }
  }
  @media (max-width: 900px) { .tabs .lungo { display: none; } }

  main { max-width: 1280px; margin: 0 auto; padding: 20px; }
  body.home main { max-width: none; padding: 0; }

  /* ---------- Elementi comuni ---------- */
  .btn {
    border: 1px solid var(--line-2); background: transparent; border-radius: 10px;
    padding: 12px 18px; min-height: 50px;
    text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 700;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--text); border-color: var(--text); color: var(--dv-black); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: var(--dv-black); }
  .btn.danger { border-color: rgba(229,103,95,.6); color: var(--danger); }
  .btn.danger.fill { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .search {
    width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); outline: none; font-size: 16px;
  }
  .search:focus { border-color: var(--line-2); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; letter-spacing: .02em;
  }
  .chip.on { background: var(--text); color: var(--dv-black); border-color: var(--text); font-weight: 600; }
  .tile { width: 46px; height: 46px; display: grid; place-items: center; font-size: 22px; flex: none; margin: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 56px 16px; line-height: 1.6; }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .page-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 18px; }
  .page-title h2 { margin: 0; font-size: 36px; line-height: 1; }
  .page-title .sub { color: var(--muted); }
  .page-title .btn { margin-left: auto; }

  /* ---------- Home ---------- */
  .hero {
    position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    background: #000 center 35% / cover no-repeat;
  }
  /* Slideshow: la foto nuova entra in dissolvenza SOPRA quella vecchia, che resta ferma
     finché non è coperta. Zoom e inquadratura puntano al bancone (parte bassa della foto). */
  .hero .slides { position: absolute; inset: 0; overflow: hidden; z-index: 0; background: #000; }
  .slide {
    position: absolute; inset: 0; background: center 72% / cover no-repeat;
    opacity: 0; z-index: 0; transform: scale(1); transform-origin: 50% 75%;
    transition: none; will-change: transform, opacity; backface-visibility: hidden;
  }
  .slide.on { opacity: 1; z-index: 2; transform: scale(1.08); transition: opacity 1.6s ease-in-out, transform 7s linear; }
  .slide.out { opacity: 1; z-index: 1; transform: scale(1.08); transition: transform 7s linear; }
  @media (prefers-reduced-motion: reduce) { .slide.on, .slide.out { transform: none; } }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
  .dots button { width: 7px; height: 7px; padding: 0; border-radius: 50%; border: none; background: rgba(255,255,255,.3); }
  .dots button.on { background: var(--accent); width: 22px; border-radius: 4px; transition: width .3s; }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.4) 30%, rgba(0,0,0,.78) 60%, var(--dv-black) 92%);
  }
  .hero > *:not(.slides) { position: relative; z-index: 2; }
  .hero-top {
    padding: calc(env(safe-area-inset-top) + 48px) 20px 0; text-align: center; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .hero-top img { width: clamp(180px, 34vw, 280px); height: auto; filter: drop-shadow(0 0 30px rgba(255,255,255,.18)); }
  .hero-top .line { display: flex; align-items: center; gap: 14px; margin-top: 22px; color: rgba(255,255,255,.8); }
  .hero-top .line::before, .hero-top .line::after { content: ""; width: 36px; height: 1px; background: var(--accent); }
  .hero-top .date { margin-top: 10px; color: var(--muted); font-size: 13px; letter-spacing: .06em; }
  /* Primo schermo: foto, logo e solo Tavoli. Scorrendo: Ricette, Menu e Nuovo tavolo */
  .hero-cards {
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
    width: min(560px, 100%); margin: 36px auto 0; padding: 0 20px calc(18px + env(safe-area-inset-bottom));
  }
  .scroll-hint {
    display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 6px auto 0;
    background: none; border: none; color: rgba(255,255,255,.7); padding: 8px 16px;
  }
  .scroll-hint .freccia { font-size: 20px; animation: rimbalza 1.8s ease-in-out infinite; }
  @keyframes rimbalza { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .scroll-hint .freccia { animation: none; } }
  .home-more {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;
    width: min(1000px, 100%); margin: 0 auto; padding: 28px 20px calc(40px + env(safe-area-inset-bottom));
  }
  .home-more .hcard { background: var(--panel); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .hcard {
    text-align: left; text-decoration: none; color: var(--text);
    background: rgba(17,17,19,.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line-2); border-radius: 14px; padding: 22px 22px 20px;
    display: flex; flex-direction: column; gap: 6px; min-height: 160px; position: relative; overflow: hidden;
  }
  .hcard:active { transform: scale(.98); }
  .hcard::after { content: "›"; position: absolute; right: 20px; top: 14px; font-size: 30px; color: var(--muted); font-weight: 300; }
  .hcard .k { color: var(--accent); }
  .hcard h3 { margin: 2px 0 0; font-size: 34px; line-height: 1; }
  .hcard .v { margin-top: auto; color: var(--muted); font-size: 14px; }
  .hcard .v b { color: var(--text); font-size: 20px; font-weight: 600; }

  /* ---------- Visualizza menu ---------- */
  .zoom { margin-left: auto; display: flex; gap: 8px; }
  .zoom .btn { min-height: 48px; }
  .zoom .zoom-v { min-width: 84px; padding: 0 12px; letter-spacing: .04em; font-size: 14px; }
  .page-title .zoom .btn { margin-left: 0; }
  .carta { display: flex; flex-direction: column; align-items: center; gap: 24px; padding-bottom: 24px; }
  .carta img {
    display: block; width: min(var(--pagina, 820px), 100%); height: auto; aspect-ratio: 1 / 1;
    border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel);
  }

  /* ---------- Ricette ---------- */
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .rcard {
    display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .rcard:active { border-color: var(--line-2); }
  .rcard .n { font-family: var(--dv-serif); font-weight: 600; font-size: 22px; line-height: 1.1; }
  .rcard .s { color: var(--muted); font-size: 12px; margin-top: 4px; letter-spacing: .02em; }

  /* ---------- I nostri Prodotti ---------- */
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .pcard {
    display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .pcard:active { border-color: var(--line-2); }
  .pfoto {
    aspect-ratio: 3 / 4; width: 100%; display: grid; place-items: center; font-size: 44px;
    background: radial-gradient(circle at 50% 35%, #2a2d33, var(--dv-coal) 75%) center / contain no-repeat;
  }
  .pfoto.img { background-color: #fff; background-image: var(--foto); background-size: contain; background-origin: content-box; padding: 10px; }
  .pcard .t { padding: 10px 12px 12px; }
  .pcard .n { font-family: var(--dv-serif); font-weight: 600; font-size: 19px; line-height: 1.1; }
  .pcard .s { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .prod-head { padding: 44px 24px 0; display: flex; justify-content: center; }
  .prod-head .pfoto { width: min(240px, 60vw); border-radius: 12px; font-size: 72px; }
  .prod-txt { margin: 0; line-height: 1.6; font-size: 15px; }
  .btl {
    width: 30px; height: 40px; margin-left: 8px; vertical-align: middle; flex: none;
    border: 1px solid var(--line-2); border-radius: 6px; background: #fff center / contain no-repeat; background-origin: content-box;
    padding: 2px; font-size: 15px; line-height: 1;
  }
  .btl.vuota { background: transparent; }
  .vtags span:has(.btl) { display: inline-flex; align-items: center; padding-right: 5px; }
  .vtags .btl { width: 24px; height: 32px; margin-left: 6px; }
  .usato { display: flex; flex-wrap: wrap; gap: 6px; }
  .usato button { border: 1px solid var(--line-2); background: transparent; color: var(--text); border-radius: 999px; padding: 7px 13px; font-size: 13px; }
  .hcard.wide { grid-column: 1 / -1; }

  .ric-head { position: relative; padding: 36px 0 4px; display: flex; justify-content: center; }
  .ric-head .dv-ring { width: 120px; height: 120px; display: grid; place-items: center; font-size: 54px; }
  .ric-body { padding: 18px 24px 28px; }
  .ric-body h3 { margin: 0; font-size: 38px; text-align: center; line-height: 1.05; }
  .ric-sub { text-align: center; margin-top: 10px; color: var(--muted); }
  .ric-sub .p { color: var(--accent); margin-left: 10px; }
  .ric-body h4 {
    margin: 26px 0 10px; display: flex; align-items: center; gap: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .22em; font-size: 11px; font-weight: 600;
  }
  .ric-body h4::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 20px; }
  .meta div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; line-height: 1.35; }
  .meta b { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .18em; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .ingr { width: 100%; border-collapse: collapse; }
  .ingr td { padding: 11px 2px; border-bottom: 1px solid var(--line); font-size: 16px; text-align: left; }
  .ingr td:last-child { text-align: right; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; display: flex; gap: 14px; padding: 8px 0; line-height: 1.5; font-size: 16px; }
  .steps li::before {
    content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--accent);
    color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 13px;
  }
  .nota { margin-top: 18px; border-left: 2px solid var(--accent); padding: 4px 0 4px 14px; line-height: 1.5; color: var(--muted); }

  /* ---------- Lista tavoli ---------- */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .tcard {
    text-align: left; padding: 18px 18px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    display: flex; flex-direction: column; gap: 4px; min-height: 140px;
  }
  .tcard:active { transform: scale(.98); border-color: var(--line-2); }
  .tcard .n { font-family: var(--dv-serif); font-size: 28px; font-weight: 600; line-height: 1.05; word-break: break-word; }
  .tcard .i { color: var(--muted); font-size: 13px; }
  .tcard .t { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); font-size: 22px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ---------- Dettaglio tavolo ---------- */
  .thead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .thead h2 { margin: 0; font-size: 36px; line-height: 1; word-break: break-word; }
  .thead .since { color: var(--muted); font-size: 13px; width: 100%; }
  .back { text-decoration: none; display: inline-flex; align-items: center; color: var(--text); }
  .icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); flex: none; }
  .tlayout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  .mtabs { display: none; }
  @media (min-width: 900px) {
    .tlayout { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
    .ordine { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top) + 16px); }
  }
  @media (max-width: 899px) {
    .mtabs {
      display: flex; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top) + var(--top-h)); z-index: 5;
      margin: 0 -20px 14px; padding: 8px 20px; background: rgba(10,10,11,.92);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
    }
    .mtabs button {
      flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
      color: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: .04em;
    }
    .mtabs button.on { background: var(--text); border-color: var(--text); color: var(--dv-black); }
    .tlayout[data-pane="ordine"] #picker, .tlayout[data-pane="aggiungi"] #ordine { display: none; }
  }
  .righe { max-height: calc(100vh - 340px); overflow-y: auto; }
  @media (max-width: 899px) { .righe { max-height: none; } }
  .riga { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .riga .info { flex: 1; min-width: 0; }
  .riga .nome { font-weight: 600; font-size: 16px; background: none; border: none; padding: 0; text-align: left; }
  .riga .nome.link { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 4px; }
  .riga .cad { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .riga .tot { width: 84px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .step { display: flex; align-items: center; border-radius: 10px; border: 1px solid var(--line-2); }
  .step button { width: 44px; height: 44px; border: none; background: none; font-size: 20px; }
  .step span { min-width: 40px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .step.pay { border-color: var(--accent); background: var(--dv-tq-soft); }
  .step.pay span { color: var(--accent); }
  .mini { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .totale { display: flex; justify-content: space-between; align-items: baseline; padding: 18px; }
  .totale span:first-child { text-transform: uppercase; letter-spacing: .2em; font-size: 12px; font-weight: 600; color: var(--muted); }
  .totale .v { font-family: var(--dv-serif); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .totale.pay .v { color: var(--accent); }
  .azioni { display: flex; gap: 10px; padding: 0 18px 18px; flex-wrap: wrap; }
  .azioni .btn { flex: 1; min-width: 140px; }
  .paga-banner { margin: 0 18px 14px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .paga-banner b { color: var(--text); }

  .picker { padding: 16px; }
  .picker.off { opacity: .3; pointer-events: none; }
  .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .pbtn {
    position: relative; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; min-height: 64px;
  }
  .pbtn:active { transform: scale(.97); }
  .pbtn.flash { border-color: var(--accent); background: var(--dv-tq-soft); }
  .pbtn .tile { width: 38px; height: 38px; font-size: 18px; }
  .pbtn .n { font-weight: 600; line-height: 1.2; font-size: 14px; }
  .pbtn .p { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pbtn .badge {
    position: absolute; top: -7px; right: -7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
    background: var(--accent); color: var(--dv-black); font-weight: 700; font-size: 12px; display: grid; place-items: center;
  }
  /* Menu a tendina per aggiungere al tavolo */
  .acc-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .acc { border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); overflow: hidden; }
  .acc.open { border-color: var(--line-2); }
  .acc-h {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 58px;
    background: none; border: none; text-align: left;
  }
  .acc-n { flex: 1; font-family: var(--dv-serif); font-size: 23px; font-weight: 600; line-height: 1.1; }
  .acc-c { color: var(--muted); font-size: 12px; min-width: 22px; text-align: right; }
  .chev { color: var(--muted); font-size: 24px; line-height: 1; transition: transform .2s ease; }
  .acc.open > .acc-h .chev { transform: rotate(90deg); color: var(--accent); }
  .acc.open > .acc-h .acc-n { color: var(--accent); }
  .acc-b { padding: 0 10px 12px; }
  .acc.sub { background: var(--panel); margin-top: 8px; }
  .acc.sub .acc-h { min-height: 50px; padding: 10px 14px; }
  .acc.sub .acc-n { font-family: var(--dv-sans); font-size: 15px; font-weight: 600; }
  .acc.ter { background: var(--panel-2); }
  .acc.ter .acc-h { min-height: 46px; }
  .acc.ter .acc-n { font-size: 14px; }
  .acc-b > .plist:first-child { margin-top: 2px; }
  .vgrp { margin-top: 12px; }
  .vgrp:first-child { margin-top: 4px; }
  .vgrp-h { color: var(--accent); margin: 0 4px 8px; }
  .vhead { padding: 26px 24px 6px; }
  .vhead h3 { margin: 0; font-size: 32px; line-height: 1.05; padding-right: 48px; }
  .vhead p { margin: 6px 0 0; color: var(--muted); }
  .vlist { display: grid; gap: 8px; padding: 14px 24px 24px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .vbtn {

<body class="dv-bg">

    <nav class="tabs">
      <a href="#tavoli" id="tabTavoli">Tavoli</a>
      <a href="#ricette" id="tabRicette">Ricette</a>
      <a href="#carta" id="tabCarta"><span class="lungo">Visualizza </span>menu</a>

      <a href="#cronologia" id="tabCronologia">Cronologia</a>
    </nav>
    <button class="agg-btn" data-action="aggiorna" aria-label="Controlla aggiornamenti"><span class="ic">↻</span><span class="tx">Aggiorna</span></button>

  <div class="overlay" id="overlay"><div class="box" id="box"></div></div>
  <div class="toast" id="toast"></div>
  <div class="avviso" id="avviso" role="status"><span id="avvisoTesto"></span><button class="btn" id="avvisoBtn">Aggiorna</button></div>

<script src="../shared/config.js"></script>
<script>
(function () {
  const D = window.DEJAVU;
  const KEY = "dejavu.staff.tavoli.v1";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
  const euro = (cent) => fmt.format(cent / 100);
  const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  // Dentro l'app Android c'è il ponte verso il tablet (file di menu e cronologia, download, link esterni)
  const APP = window.DejavuAndroid || null;
  /* Il menu si modifica dall'app e resta salvato SU QUESTO DISPOSITIVO
     (nell'app Android nel file dati/menu.json, con la copia .bak; nel browser nella sua memoria).
     Al primo avvio si parte dal menu originale, shared/menu.json, che è dentro l'app. */
  const MENU_ORIGINALE = "../shared/menu.json";
  const MENU_KEY = "dejavu.staff.menu.cache.v1"; // nel browser: stesso nome di prima, così il menu in uso resta
  const clona = (o) => JSON.parse(JSON.stringify(o));
  const menuValido = (m) => !!(m && Array.isArray(m.categorie) && Array.isArray(m.drinks));
  function leggiMenuSalvato() {
    try { const m = JSON.parse(APP ? APP.leggiDati("menu.json") : localStorage.getItem(MENU_KEY)); return menuValido(m) ? m : null; } catch { return null; }
  }
  let MENU = leggiMenuSalvato();
  async function menuOriginale() {
    const r = await fetch(`${MENU_ORIGINALE}?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const m = await r.json();
    if (!menuValido(m)) throw new Error("menu non valido");
    return m;
  }
  // Salva il menu sul dispositivo e da subito si usa quello
  function salvaMenu(nuovo) {
    nuovo.versione = new Date().toISOString();
    const testo = JSON.stringify(nuovo, null, 2);
    let ok = false;
    if (APP) ok = APP.scriviDati("menu.json", testo);
    else { try { localStorage.setItem(MENU_KEY, testo); ok = true; } catch {} }
    if (!ok) throw new Error("Non sono riuscito a salvare il menu sul dispositivo.");
    MENU = nuovo;
  }
  // la vecchia chiave di pubblicazione su GitHub non serve più: si toglie dal dispositivo
  try { localStorage.removeItem("dejavu.staff.github.token"); } catch {}

  /* ---------- Avviso "nuova versione dell'app" ---------- */
  let avvisoTipo = null;
  function mostraAvviso(tipo) {
    avvisoTipo = tipo;
    $("#avvisoTesto").textContent = "È disponibile una nuova versione dell'app.";
    $("#avvisoBtn").textContent = tipo === "apk" ? "Scarica" : "Aggiorna";
    $("#avviso").classList.add("show");
  }
  $("#avvisoBtn").addEventListener("click", () => {
    $("#avviso").classList.remove("show");
    if (avvisoTipo === "apk") APP.apriLink(apkNuovo.url);
    else location.reload();
    avvisoTipo = null;
  });

  const drinkById = (id) => MENU.drinks.find((d) => d.id === id);
  const catNome = (id) => (MENU.categorie.find((c) => c.id === id) || {}).nome || "";
  const ricette = () => MENU.drinks.filter((d) => d.ingredienti && d.ingredienti.length);
  const haRicetta = (d) => !!(d && d.ingredienti && d.ingredienti.length);
  const varNome = (v) => (typeof v === "string" ? v : v.nome);
  const varPrezzo = (d, v) => (typeof v === "object" && v.prezzo != null ? v.prezzo : d.prezzo);
  const cent = (p) => Math.round(p * 100);
  function prezzoLabel(d) {
    const ps = (d.varianti || []).map((v) => varPrezzo(d, v));
    const min = ps.length ? Math.min(...ps) : d.prezzo;
    if (!min && !ps.some((p) => p)) return "Omaggio";
    return (ps.some((p) => p !== ps[0]) ? "da " : "") + euro(cent(min));
  }

  $("#brandLogo").src = D.bar.logo;
  document.title = `${D.bar.nome} · Staff`;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* ---------- Dati tavoli (salvati nel browser) ---------- */
  let tavoli = carica();
  function carica() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function salva() {
    try { localStorage.setItem(KEY, JSON.stringify(tavoli)); }
    catch { alert("Attenzione: impossibile salvare i dati sul dispositivo."); }
  }
  const tavoloById = (id) => tavoli.find((t) => t.id === id);
  const totale = (t) => t.righe.reduce((s, r) => s + r.qty * r.prezzoCent, 0);
  const pezzi = (t) => t.righe.reduce((s, r) => s + r.qty, 0);

  window.addEventListener("storage", (e) => {
    if (e.key === KEY) { tavoli = carica(); render(); }
  });

  /* ---------- Stato interfaccia ---------- */
  const ui = {
    ricQ: "", ricCat: "tutti",
    prodQ: "", prodTipo: "Tutti",
    pickQ: "", apriGruppo: null, apriCat: null, apriVoce: null, // menu a tendina "Aggiungi"
    meQ: "", meCat: "tutti",
    pane: "ordine", // su telefono: "ordine" oppure "aggiungi"
    pagamento: null, // { id: tavoloId, sel: { rigaId: quantità } }
  };

  const visual = (d) => (d && d.img ? `background-image:url('${esc(d.img)}')` : "");
  const tileHtml = (d) => `<div class="tile dv-ring" style="${visual(d)}">${d && d.img ? "" : esc((d && d.emoji) || "🧾")}</div>`;

  function filtra(lista, q, cat) {
    const nq = norm(q.trim());
    return lista.filter((d) => {
      if (nq) return norm([d.nome, ...(d.ingredienti || []).map((i) => i.nome), ...(d.varianti || []).map(varNome)].join(" ")).includes(nq);
      return cat === "tutti" || d.categoria === cat;
    });
  }
  function chipsHtml(lista, sel, action) {
    const cats = [{ id: "tutti", nome: "Tutti" }, ...MENU.categorie.filter((c) => lista.some((d) => d.categoria === c.id))];
    return cats.map((c) => `<button class="chip ${c.id === sel ? "on" : ""}" data-action="${action}" data-cat="${esc(c.id)}">${esc(c.nome)}</button>`).join("");
  }

  /* ---------- Routing ---------- */
  function route() {
    const h = location.hash.slice(1);
    if (h.startsWith("tavolo/")) return { view: "tavolo", id: decodeURIComponent(h.slice(7)) };
    if (h === "ricette" || h === "tavoli" || h === "menu" || h === "prodotti" || h === "cronologia" || h === "carta") return { view: h };
    return { view: "home" };
  }
  function paneIniziale() {
    const r = route();
    const t = r.view === "tavolo" && tavoloById(r.id);
    ui.pane = t && !t.righe.length ? "aggiungi" : "ordine";
  }
  window.addEventListener("hashchange", () => { ui.pagamento = null; ui.pickQ = ""; paneIniziale(); render(); window.scrollTo(0, 0); });

  function render() {
    const r = route();
    document.body.classList.toggle("home", r.view === "home");
    if (r.view !== "home") clearInterval(slideTimer);
    $("#tabRicette").classList.toggle("on", r.view === "ricette");
    $("#tabCarta").classList.toggle("on", r.view === "carta");
    $("#tabMenu").classList.toggle("on", r.view === "menu");
    $("#tabCronologia").classList.toggle("on", r.view === "cronologia");
    $("#tabTavoli").classList.toggle("on", r.view === "tavoli" || r.view === "tavolo");
    if (r.view === "home") return viewHome();
    if (r.view === "ricette") return viewRicette();
    if (r.view === "menu") return viewMenu();
    if (r.view === "prodotti") return viewProdotti();
    if (r.view === "cronologia") return viewCronologia();
    if (r.view === "carta") return viewCarta();
    if (r.view === "tavolo") {
      const t = tavoloById(r.id);
      if (!t) { location.replace("#tavoli"); return viewTavoli(); }
      return viewTavolo(t);
    }
    viewTavoli();
  }

  /* ---------- Home ---------- */
  const foto = [].concat(D.bar.foto || []);
  let slideTimer = null, outTimer = null, slideIdx = 0;
  // Precarica le foto così il primo cambio non scatta
  foto.forEach((src) => { const im = new Image(); im.src = src; if (im.decode) im.decode().catch(() => {}); });
  function mostraSlide(i) {
    const slides = [...document.querySelectorAll(".slide")];
    if (!slides.length) return;
    const next = (i + slides.length) % slides.length;
    const prev = slides.find((el) => el.classList.contains("on"));
    if (prev === slides[next]) return;
    clearTimeout(outTimer);
    slides.forEach((el) => el.classList.remove("out"));
    if (prev) {
      prev.classList.replace("on", "out");
      outTimer = setTimeout(() => prev.classList.remove("out"), 1700);
    }
    slides[next].classList.add("on");
    slideIdx = next;
    document.querySelectorAll(".dots button").forEach((el, k) => el.classList.toggle("on", k === slideIdx));
  }
  function avviaSlide() {
    clearInterval(slideTimer);
    if (foto.length > 1) slideTimer = setInterval(() => mostraSlide(slideIdx + 1), 5000);
  }

  function viewHome() {
    slideIdx = 0;
    avviaSlide();
    const aperti = tavoli.reduce((s, t) => s + totale(t), 0);
    const sera = stasera();
    const oggi = new Date().toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
    $("#app").innerHTML = `
      <section class="hero">
        <button class="agg-btn agg-home" data-action="aggiorna" aria-label="Controlla aggiornamenti"><span class="ic">↻</span><span class="tx">Aggiorna</span></button>
        <div class="slides">${foto.map((f) => `<div class="slide" style="background-image:url('${esc(f)}')"></div>`).join("")}</div>
        <div class="hero-top">
          <img src="${esc(D.bar.logo)}" alt="${esc(D.bar.nome)}">
          <div class="line dv-caps">${esc(D.bar.sottotitolo)}</div>
          <div class="date">${esc(oggi)}</div>
          ${foto.length > 1 ? `<div class="dots">${foto.map((_, i) => `<button data-action="slide" data-i="${i}" class="${i ? "" : "on"}" aria-label="Foto ${i + 1}"></button>`).join("")}</div>` : ""}
        </div>
        <div class="hero-cards">
          <a class="hcard" href="#tavoli">
            <span class="k dv-caps">Sala</span>
            <h3>Tavoli</h3>
            <div class="v">${tavoli.length
              ? `<b>${tavoli.length}</b> ${tavoli.length === 1 ? "aperto" : "aperti"} · <b>${euro(aperti)}</b>`
              : "Nessun tavolo aperto"}</div>
          </a>
          <button class="scroll-hint" data-action="scendi"><span class="dv-caps">Ricette, Prodotti, Menu e Cronologia</span><span class="freccia">↓</span></button>
        </div>
      </section>
      <section class="home-more">
          <a class="hcard" href="#ricette">
            <span class="k dv-caps">Bancone</span>
            <h3>Ricette</h3>
            <div class="v"><b>${ricette().length}</b> ricette · <b>${MENU.drinks.length}</b> voci di menu</div>
          </a>
          <a class="hcard" href="#prodotti">
            <span class="k dv-caps">Bottigliera</span>
            <h3>I nostri Prodotti</h3>
            <div class="v"><b>${bottiglie().length}</b> bottiglie e materie prime</div>
          </a>
          <a class="hcard" href="#carta">
            <span class="k dv-caps">Menu cartaceo</span>
            <h3>Visualizza menu</h3>
            <div class="v">Il menu del locale · <b>${pagineCarta.length}</b> pagine</div>
          </a>
          <a class="hcard" href="#menu">
            <span class="k dv-caps">Gestione</span>
            <h3>Modifica menu</h3>
            <div class="v">Voci, prezzi e ricette</div>
          </a>
          <a class="hcard wide" href="#cronologia">
            <span class="k dv-caps">Titolare</span>
            <h3>Cronologia</h3>
            <div class="v">${sera.cent ? `Stasera <b>${euro(sera.cent)}</b> incassati` : "Serate, incassi, prodotti più venduti"}</div>
          </a>
      </section>`;
    requestAnimationFrame(() => requestAnimationFrame(() => mostraSlide(0)));
  }

  /* ---------- Visualizza menu: le pagine del menu cartaceo, una sotto l'altra, con lo zoom ---------- */
  const pagineCarta = [].concat(D.menuCartaceo || []);
  const LIVELLI_ZOOM = [0.5, 0.65, 0.8, 1, 1.25, 1.5];
  const ZOOM_KEY = "dejavu.staff.zoom-menu";
  let zoomCarta = (() => { try { const z = +localStorage.getItem(ZOOM_KEY); return z >= 0 && z < LIVELLI_ZOOM.length && localStorage.getItem(ZOOM_KEY) !== null ? z : 3; } catch { return 3; } })();
  function viewCarta() {
    $("#app").innerHTML = `
      <div class="page-title">
        <h2>Menu del locale</h2>
        <span class="sub">${pagineCarta.length} pagine</span>
        <div class="zoom">
          <button class="btn icona" data-action="zoom" data-passo="-1" aria-label="Rimpicciolisci">−</button>
          <button class="btn zoom-v" data-action="zoom" data-passo="0" aria-label="Zoom normale"></button>
          <button class="btn icona" data-action="zoom" data-passo="1" aria-label="Ingrandisci">+</button>
        </div>
      </div>
      ${pagineCarta.length
        ? `<div class="carta">${pagineCarta.map((f, i) => `<img src="${esc(f)}" alt="Pagina ${i + 1} del menu" loading="${i < 2 ? "eager" : "lazy"}">`).join("")}</div>`
        : `<div class="empty"><div class="big">📄</div>Il menu cartaceo non è incluso in questa versione dell'app.</div>`}`;
    applicaZoom();
  }
  function applicaZoom() {
    // larghezza di una pagina: 820 px al 100%, mai più larga dello schermo
    document.documentElement.style.setProperty("--pagina", `${Math.round(820 * LIVELLI_ZOOM[zoomCarta])}px`);
    const v = $(".zoom-v");
    if (!v) return;
    v.textContent = `${Math.round(LIVELLI_ZOOM[zoomCarta] * 100)}%`;
    document.querySelector('[data-action=zoom][data-passo="-1"]').disabled = zoomCarta === 0;
    document.querySelector('[data-action=zoom][data-passo="1"]').disabled = zoomCarta === LIVELLI_ZOOM.length - 1;
  }

  /* ---------- Ricette ---------- */
  function viewRicette() {
    $("#app").innerHTML = `
      <div class="page-title"><h2>Ricette</h2><span class="sub">${ricette().length} drink</span></div>
      <input class="search" id="ricQ" type="search" placeholder="Cerca drink o ingrediente…" value="${esc(ui.ricQ)}" autocomplete="off">
      <div class="chips" id="ricChips"></div>
      <div class="rgrid" id="ricLista"></div>`;
    $("#ricQ").addEventListener("input", (e) => { ui.ricQ = e.target.value; listaRicette(); });
    listaRicette();
  }
  function listaRicette() {
    $("#ricChips").innerHTML = chipsHtml(ricette(), ui.ricQ.trim() ? "" : ui.ricCat, "ric-cat");
    const items = filtra(ricette(), ui.ricQ, ui.ricCat);
    $("#ricLista").innerHTML = items.length
      ? items.map((d) => `
        <button class="rcard" data-action="apri-ricetta" data-id="${esc(d.id)}">
          ${tileHtml(d)}
          <div><div class="n">${esc(d.nome)}</div><div class="s">${d.metodo ? esc(d.metodo) + (d.bicchiere ? " · " + esc(d.bicchiere) : "") : esc(catNome(d.categoria))}</div></div>
        </button>`).join("")
      : `<div class="empty">Nessun drink trovato.</div>`;
  }
  function apriRicetta(id) {
    const d = drinkById(id);
    if (!d) return;
    const meta = [["Bicchiere", d.bicchiere], ["Ghiaccio", d.ghiaccio], ["Metodo", d.metodo], ["Guarnizione", d.guarnizione]]
      .filter(([, v]) => v).map(([k, v]) => `<div><b>${k}</b>${esc(v)}</div>`).join("");
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <div class="ric-head"><div class="dv-ring" style="${visual(d)}">${d.img ? "" : esc(d.emoji || "🍸")}</div></div>
      <div class="ric-body">
        <h3>${esc(d.nome)}</h3>
        <div class="ric-sub"><span class="dv-caps">${esc(catNome(d.categoria))}</span><span class="p">${prezzoLabel(d)}</span></div>
        ${d.descrizione ? `<p class="ric-sub" style="margin-top:14px">${esc(d.descrizione)}</p>` : ""}
        ${meta ? `<div class="meta">${meta}</div>` : ""}
        <h4>Ingredienti</h4>
        <table class="ingr">${d.ingredienti.map((i) => `<tr><td>${esc(i.nome)}${miniBottiglie(i.nome)}</td><td>${esc(i.dose || "")}</td></tr>`).join("")}</table>
        ${d.varianti ? `<h4>Varianti</h4><div class="vtags">${d.varianti.map((v) => `<span>${esc(varNome(v))}${miniBottiglie(varNome(v))}</span>`).join("")}</div>` : ""}
        ${d.passaggi && d.passaggi.length ? `<h4>Procedimento</h4><ol class="steps">${d.passaggi.map((p) => `<li>${esc(p)}</li>`).join("")}</ol>` : ""}
        ${d.note ? `<div class="nota">${esc(d.note)}</div>` : ""}
      </div>`);
  }

  /* ---------- I nostri Prodotti ---------- */
  const bottiglie = () => (MENU && MENU.prodotti) || [];
  const fotoProdotto = (p) => p.img
    ? `<div class="pfoto img" style="--foto:url('${esc(p.img)}')" role="img" aria-label="${esc(p.nome)}"></div>`
    : `<div class="pfoto">🍾</div>`;
  // Bottiglie citate in un testo (ingrediente o variante), cercando le chiavi p.cerca
  const bottiglieIn = (testo) => {
    const t = norm(testo);
    return bottiglie().filter((p) => p.cerca && [].concat(p.cerca).some((k) => t.includes(norm(k))));
  };
  // Miniature cliccabili che aprono la scheda della bottiglia
  const miniBottiglie = (testo) => bottiglieIn(testo).map((p) =>
    `<button class="btl${p.img ? "" : " vuota"}" data-action="apri-prodotto" data-id="${esc(p.id)}" title="${esc(p.nome)}" aria-label="Vedi ${esc(p.nome)}"${p.img ? ` style="background-image:url('${esc(p.img)}')"` : ""}>${p.img ? "" : "🍾"}</button>`).join("");
  // Drink che usano il prodotto: p.drink (id espliciti) oppure p.cerca (o il nome) negli ingredienti e nelle varianti
  function drinkConProdotto(p) {
    if (p.drink) return MENU.drinks.filter((d) => p.drink.includes(d.id));
    const chiavi = [].concat(p.cerca || p.nome).map(norm);
    return MENU.drinks.filter((d) => {
      const testo = norm([...(d.ingredienti || []).map((i) => i.nome), ...(d.varianti || []).map(varNome)].join(" | "));
      return chiavi.some((k) => testo.includes(k));
    });
  }
  function viewProdotti() {
    $("#app").innerHTML = `
      <div class="page-title"><h2>I nostri Prodotti</h2><span class="sub">${bottiglie().length} bottiglie</span></div>
      <input class="search" id="prodQ" type="search" placeholder="Cerca bottiglia…" value="${esc(ui.prodQ)}" autocomplete="off">
      <div class="chips" id="prodChips"></div>
      <div class="pgrid" id="prodLista"></div>`;
    $("#prodQ").addEventListener("input", (e) => { ui.prodQ = e.target.value; listaProdotti(); });
    listaProdotti();
  }
  function listaProdotti() {
    const tipi = ["Tutti", ...new Set(bottiglie().map((p) => p.tipo))];
    const sel = ui.prodQ.trim() ? "" : ui.prodTipo;
    $("#prodChips").innerHTML = tipi.map((t) =>
      `<button class="chip ${t === sel ? "on" : ""}" data-action="prod-tipo" data-tipo="${esc(t)}">${esc(t)}</button>`).join("");
    const nq = norm(ui.prodQ.trim());
    const items = bottiglie().filter((p) => nq
      ? norm([p.nome, p.tipo, p.produttore || ""].join(" ")).includes(nq)
      : ui.prodTipo === "Tutti" || p.tipo === ui.prodTipo);
    $("#prodLista").innerHTML = items.length
      ? items.map((p) => `
        <button class="pcard" data-action="apri-prodotto" data-id="${esc(p.id)}">
          ${fotoProdotto(p)}
          <div class="t"><div class="n">${esc(p.nome)}</div><div class="s">${esc(p.produttore ? p.tipo + " · " + p.produttore : p.tipo)}</div></div>
        </button>`).join("")
      : `<div class="empty">Nessun prodotto trovato.</div>`;
  }
  function apriProdotto(id) {
    const p = bottiglie().find((x) => x.id === id);
    if (!p) return;
    const usato = drinkConProdotto(p);
    const meta = [["Tipo", p.tipo], ["Produttore", p.produttore], ["Origine", p.origine]]
      .filter(([, v]) => v).map(([k, v]) => `<div><b>${k}</b>${esc(v)}</div>`).join("");
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <div class="prod-head">${fotoProdotto(p)}</div>
      <div class="ric-body">
        <h3>${esc(p.nome)}</h3>
        ${p.descrizione ? `<p class="ric-sub" style="margin-top:14px">${esc(p.descrizione)}</p>` : ""}
        ${meta ? `<div class="meta">${meta}</div>` : ""}
        ${usato.length ? `<h4>Lo usiamo in</h4><div class="usato">${usato.map((d) =>
          `<button data-action="apri-ricetta" data-id="${esc(d.id)}">${esc(d.nome)}</button>`).join("")}</div>` : ""}
        ${p.storia ? `<h4>La storia</h4><p class="prod-txt">${esc(p.storia)}</p>` : ""}
        ${p.gusto ? `<h4>Il gusto</h4><p class="prod-txt">${esc(p.gusto)}</p>` : ""}
        ${p.consigliato ? `<h4>Consigliato a chi ama</h4><p class="prod-txt">${esc(p.consigliato)}</p>` : ""}
      </div>`);
  }

  /* ---------- Lista tavoli ---------- */
  function tempo(ts) {
    const min = Math.floor((Date.now() - ts) / 60000);
    const ora = new Date(ts).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    const da = min < 1 ? "adesso" : min < 60 ? `da ${min} min` : `da ${Math.floor(min / 60)} h ${min % 60} min`;
    return `aperto alle ${ora} · ${da}`;
  }
  function viewTavoli() {
    const aperti = tavoli.reduce((s, t) => s + totale(t), 0);
    $("#app").innerHTML = `
      <div class="page-title">
        <h2>Tavoli</h2>
        <span class="sub">${tavoli.length ? `${tavoli.length} ${tavoli.length === 1 ? "aperto" : "aperti"} · ${euro(aperti)} da incassare` : ""}</span>
        <button class="btn primary" data-action="nuovo-tavolo">+ Nuovo tavolo</button>
      </div>
      ${tavoli.length
        ? `<div class="tgrid">${tavoli.map((t) => `
            <button class="tcard" data-action="apri-tavolo" data-id="${esc(t.id)}">
              <div class="n">${esc(t.nome)}</div>
              <div class="i">${pezzi(t)} ${pezzi(t) === 1 ? "articolo" : "articoli"}</div>
              <div class="i">${tempo(t.creato)}</div>
              <div class="t">${euro(totale(t))}</div>
            </button>`).join("")}</div>`
        : `<div class="empty"><div class="big">🥂</div>Nessun tavolo aperto.<br>Premi <b>+ Nuovo tavolo</b> quando arriva qualcuno.</div>`}`;
  }

  async function nuovoTavolo() {
    const v = await chiedi({
      titolo: "Nuovo tavolo",
      campi: [{ name: "nome", label: "Nome del tavolo", placeholder: "es. Tavolo 4, Divanetto, Esterno 2…" }],
      ok: "Crea tavolo",
      valida: (v) => validaNome(v.nome),
    });
    if (!v) return;
    const t = { id: uid(), nome: v.nome.trim(), creato: Date.now(), righe: [] };
    tavoli.push(t);
    salva();
    location.hash = "#tavolo/" + encodeURIComponent(t.id);
  }
  function validaNome(nome, escludiId) {
    const n = (nome || "").trim();
    if (!n) return "Scrivi un nome.";
    if (tavoli.some((t) => t.id !== escludiId && norm(t.nome) === norm(n))) return "Esiste già un tavolo aperto con questo nome.";
  }

  /* ---------- Dettaglio tavolo ---------- */
  function viewTavolo(t) {
    $("#app").innerHTML = `
      <div class="thead">
        <a class="btn back" href="#tavoli">‹ Tavoli</a>
        <h2 id="tNome">${esc(t.nome)}</h2>
        <button class="icon-btn" data-action="rinomina" aria-label="Rinomina">✎</button>
        <div class="since" id="tSince">${tempo(t.creato)}</div>
      </div>
      <div class="mtabs">
        <button data-action="pane" data-pane="ordine" id="mtOrdine"></button>
        <button data-action="pane" data-pane="aggiungi" id="mtAggiungi">+ Aggiungi</button>
      </div>
      <div class="tlayout" id="tlayout">
        <div class="panel ordine" id="ordine"></div>
        <div class="panel picker" id="picker">
          <input class="search" id="pickQ" type="search" placeholder="Cerca: drink, whiskey, birra, gin…" value="${esc(ui.pickQ)}" autocomplete="off">
          <div id="pickLista"></div>
        </div>
      </div>`;
    $("#pickQ").addEventListener("input", (e) => { ui.pickQ = e.target.value; listaPicker(t); });
    aggiornaTavolo(t);
  }

  function aggiornaTavolo(t) {
    const pay = ui.pagamento && ui.pagamento.id === t.id ? ui.pagamento.sel : null;
    const tot = totale(t);
    let righe;
    if (!t.righe.length) {
      righe = `<div class="empty"><div class="big">🍸</div>Nessun ordine.<br>Aggiungi i drink dall'elenco.</div>`;
    } else {
      righe = t.righe.map((r) => {
        const d = r.drinkId && drinkById(r.drinkId);
        const nome = haRicetta(d)
          ? `<button class="nome link" data-action="apri-ricetta" data-id="${esc(d.id)}">${esc(r.nome)}</button>`
          : `<div class="nome">${esc(r.nome)}</div>`;
        const step = pay
          ? `<div class="step pay">
               <button data-action="pay-dec" data-riga="${r.id}" aria-label="Meno">−</button>
               <span>${pay[r.id] || 0}/${r.qty}</span>
               <button data-action="pay-inc" data-riga="${r.id}" aria-label="Più">+</button>
             </div>
             <button class="mini" data-action="pay-riga" data-riga="${r.id}">tutti</button>`
          : `<div class="step">
               <button data-action="dec" data-riga="${r.id}" aria-label="Togli uno">−</button>
               <span>${r.qty}</span>
               <button data-action="inc" data-riga="${r.id}" aria-label="Aggiungi uno">+</button>
             </div>`;
        const lineTot = pay ? (pay[r.id] || 0) * r.prezzoCent : r.qty * r.prezzoCent;
        return `<div class="riga">
            <div class="info">${nome}<div class="cad">${euro(r.prezzoCent)} cad.</div></div>
            ${step}
            <div class="tot">${euro(lineTot)}</div>
          </div>`;
      }).join("");
    }

    let fondo;
    if (pay) {
      const sel = t.righe.reduce((s, r) => s + (pay[r.id] || 0) * r.prezzoCent, 0);
      fondo = `
        <div class="totale pay"><span>Da incassare ora</span><span class="v">${euro(sel)}</span></div>
        <div class="paga-banner">Seleziona cosa paga questa persona. Resteranno da pagare <b>${euro(tot - sel)}</b>.</div>
        <div class="azioni">
          <button class="btn" data-action="pay-annulla">Annulla</button>
          <button class="btn" data-action="pay-tutto">Tutto</button>
          <button class="btn accent" data-action="pay-conferma" ${sel ? "" : "disabled"}>Incassa ${euro(sel)}</button>
        </div>`;
    } else {
      fondo = `
        <div class="totale"><span>Totale</span><span class="v">${euro(tot)}</span></div>
        <div class="azioni">
          <button class="btn primary" data-action="paga-separato" ${t.righe.length ? "" : "disabled"}>Paga separato</button>
          <button class="btn danger" data-action="chiudi-tavolo">Chiudi tavolo</button>
        </div>`;
    }
    $("#ordine").innerHTML = `<div class="righe">${righe}</div>${fondo}`;
    $("#picker").classList.toggle("off", !!pay);
    if (pay) ui.pane = "ordine";
    $("#tlayout").dataset.pane = ui.pane;
    $("#mtOrdine").classList.toggle("on", ui.pane === "ordine");
    $("#mtAggiungi").classList.toggle("on", ui.pane === "aggiungi");
    $("#mtOrdine").textContent = `Ordine (${pezzi(t)}) · ${euro(tot)}`;
    $("#mtAggiungi").disabled = !!pay;
    listaPicker(t);
  }

  /* Gruppi del menu a tendina (es. Drink & Cocktail → I nostri Cocktail, Classici…).
     Le categorie non assegnate a un gruppo diventano un gruppo a sé. */
  function gruppi() {
    const esiste = (id) => MENU.categorie.some((c) => c.id === id);
    const lista = (MENU.gruppi || [])
      .map((g) => ({ ...g, categorie: g.categorie.filter(esiste) }))
      .filter((g) => g.categorie.length);
    const usate = new Set(lista.flatMap((g) => g.categorie));
    MENU.categorie.filter((c) => !usate.has(c.id)).forEach((c) => lista.push({ id: "cat-" + c.id, nome: c.nome, categorie: [c.id] }));
    return lista;
  }
  // Ogni prodotto ordinabile: le voci senza varianti, oppure ogni singola variante (es. ogni whiskey, ogni birra)
  const nomeRiga = (d, i) => (i == null ? d.nome : `${d.nome} · ${varNome(d.varianti[i])}`);
  function prodotti(d) {
    if (!d.varianti || !d.varianti.length) return [{ d, i: null, nome: d.nome, info: "", prezzo: d.prezzo }];
    return d.varianti.map((v, i) => ({ d, i, nome: varNome(v), info: typeof v === "object" && v.info ? v.info : "", prezzo: varPrezzo(d, v) }));
  }
  function bottoneProdotto(p, t, titolo) {
    const quanti = t.righe.filter((r) => r.drinkId === p.d.id && r.nome === nomeRiga(p.d, p.i)).reduce((s, r) => s + r.qty, 0);
    const prezzo = p.prezzo ? euro(cent(p.prezzo)) : "Omaggio";
    return `<button class="pbtn" data-action="aggiungi" data-id="${esc(p.d.id)}" data-v="${p.i == null ? "" : p.i}">
        ${tileHtml(p.d)}
        <div><div class="n">${esc(titolo)}</div><div class="p">${prezzo}${p.info ? " · " + esc(p.info) : ""}</div></div>
        ${quanti ? `<span class="badge">${quanti}</span>` : ""}
      </button>`;
  }
  // nome mostrato sul bottone dentro il menu a tendina (l'etichetta, se c'è, è il nome breve: es. "Guinness")
  const titoloVoce = (d) => d.etichetta || d.nome;
  // Prodotti di una categoria:
  // - categoria "a tendina" (es. Calice → Bianco/Rosso/Bollicine): ogni voce si apre e mostra le sue varianti
  // - voci semplici e voci con poche varianti (es. Soledad) → bottoni col nome completo
  // - voci con tante varianti (gin, whiskey, amari…) → in fondo, con un titoletto e sotto le varianti
  function prodottiCategoria(catId, t) {
    const voci = MENU.drinks.filter((d) => d.categoria === catId);
    const cat = MENU.categorie.find((c) => c.id === catId) || {};
    if (cat.tendina) {
      return voci.map((d) => {
        const aperta = ui.apriVoce === d.id;
        const lista = prodotti(d).map((p) => bottoneProdotto(p, t, p.i == null ? titoloVoce(d) : p.nome)).join("");
        return `<div class="acc sub ter ${aperta ? "open" : ""}">
          <button class="acc-h" data-action="acc-voce" data-id="${esc(d.id)}"><span class="acc-n">${esc(titoloVoce(d))}</span><span class="acc-c">${prodotti(d).length}</span><span class="chev">›</span></button>
          ${aperta ? `<div class="acc-b"><div class="plist">${lista}</div></div>` : ""}
        </div>`;
      }).join("") || `<div class="empty" style="padding:16px">Nessuna voce.</div>`;
    }
    const tante = (d) => d.varianti && d.varianti.length > 3;
    const semplici = voci.filter((d) => !tante(d)).flatMap(prodotti)
      .map((p) => bottoneProdotto(p, t, p.i == null ? titoloVoce(p.d) : `${titoloVoce(p.d)} · ${p.nome}`));
    let html = semplici.length ? `<div class="plist">${semplici.join("")}</div>` : "";
    voci.filter(tante).forEach((d) => {
      html += `<div class="vgrp"><div class="vgrp-h dv-caps">${esc(titoloVoce(d))}</div><div class="plist">${prodotti(d).map((p) => bottoneProdotto(p, t, p.nome)).join("")}</div></div>`;
    });
    return html || `<div class="empty" style="padding:16px">Nessuna voce.</div>`;
  }
  const quantiProdotti = (catIds) => MENU.drinks.filter((d) => catIds.includes(d.categoria)).reduce((s, d) => s + prodotti(d).length, 0);

  function listaPicker(t) {
    const q = norm(ui.pickQ.trim());
    let html;
    if (q) {
      // Ricerca: trova qualsiasi prodotto, anche le singole varianti
      const trovati = MENU.drinks.flatMap(prodotti).filter((p) =>
        norm([p.d.nome, p.nome, p.info, catNome(p.d.categoria)].join(" ")).includes(q));
      html = trovati.length
        ? `<div class="plist">${trovati.map((p) => bottoneProdotto(p, t, nomeRiga(p.d, p.i))).join("")}</div>`
        : `<div class="empty" style="padding:24px 8px">Nessun risultato per «${esc(ui.pickQ.trim())}».</div>`;
    } else {
      html = `<div class="acc-list">${gruppi().map((g) => {
        const aperto = ui.apriGruppo === g.id;
        let corpo = "";
        if (aperto) {
          corpo = g.categorie.length > 1
            ? g.categorie.map((c) => {
                const apertoCat = ui.apriCat === c;
                return `<div class="acc sub ${apertoCat ? "open" : ""}">
                  <button class="acc-h" data-action="acc-cat" data-c="${esc(c)}"><span class="acc-n">${esc(catNome(c))}</span><span class="acc-c">${quantiProdotti([c])}</span><span class="chev">›</span></button>
                  ${apertoCat ? `<div class="acc-b">${prodottiCategoria(c, t)}</div>` : ""}
                </div>`;
              }).join("")
            : prodottiCategoria(g.categorie[0], t);
        }
        return `<div class="acc ${aperto ? "open" : ""}" id="acc-${esc(g.id)}">
          <button class="acc-h" data-action="acc" data-g="${esc(g.id)}"><span class="acc-n">${esc(g.nome)}</span><span class="acc-c">${quantiProdotti(g.categorie)}</span><span class="chev">›</span></button>
          ${aperto ? `<div class="acc-b">${corpo}</div>` : ""}
        </div>`;
      }).join("")}</div>`;
    }
    $("#pickLista").innerHTML = html + `<div class="plist" style="margin-top:12px"><button class="pbtn libera" data-action="voce-libera">+ Voce libera</button></div>`;
  }

  function aggiungiRiga(t, { drinkId = null, nome, prezzoCent }) {
    const r = t.righe.find((x) => x.drinkId === drinkId && x.nome === nome && x.prezzoCent === prezzoCent);
    if (r) r.qty++;
    else t.righe.push({ id: uid(), drinkId, nome, prezzoCent, qty: 1 });
    salva();
    aggiornaTavolo(t);
  }

  function sceltaVariante(d) {
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <div class="vhead"><h3>${esc(d.nome)}</h3><p>${d.descrizione ? esc(d.descrizione) : "Scegli:"}</p></div>
      <div class="vlist">${d.varianti.map((v, i) => `
        <button class="vbtn" data-action="aggiungi-var" data-id="${esc(d.id)}" data-i="${i}">
          <span class="n">${esc(varNome(v))}</span>
          ${typeof v === "object" && v.info ? `<span class="i">${esc(v.info)}</span>` : ""}
          <span class="p">${euro(cent(varPrezzo(d, v)))}</span>
        </button>`).join("")}</div>`);
  }

  /* ---------- Finestre (dialoghi) ---------- */
  let risolvi = null, finestraBloccata = false;
  function apriFinestra(html, small) {
    if (risolvi) { const r = risolvi; risolvi = null; r(null); }
    finestraBloccata = false;
    $("#box").className = "box" + (small ? " small" : "");
    $("#box").innerHTML = html;
    $("#box").scrollTop = 0;
    $("#overlay").classList.add("open");
  }
  function chiudiFinestra(valore = null) {
    finestraBloccata = false;
    $("#overlay").classList.remove("open");
    const r = risolvi; risolvi = null;
    if (r) r(valore);
  }
  function conferma({ titolo, testo, ok = "Conferma", pericolo = false }) {
    apriFinestra(`
      <div class="dlg">
        <h3>${esc(titolo)}</h3>
        <p>${testo}</p>
        <div class="dlg-actions">
          <button class="btn" data-action="chiudi-finestra">Annulla</button>
          <button class="btn ${pericolo ? "danger fill" : "primary"}" data-action="finestra-ok">${esc(ok)}</button>
        </div>
      </div>`, true);
    return new Promise((res) => (risolvi = res));
  }
  function chiedi({ titolo, campi, ok = "OK", valida }) {
    apriFinestra(`
      <form class="dlg" id="dlgForm" autocomplete="off">
        <h3>${esc(titolo)}</h3>
        ${campi.map((c) => `<label>${esc(c.label)}<input name="${c.name}" value="${esc(c.value || "")}" placeholder="${esc(c.placeholder || "")}" ${c.inputmode ? `inputmode="${c.inputmode}"` : ""}></label>`).join("")}
        <div class="err" id="dlgErr"></div>
        <div class="dlg-actions">
          <button type="button" class="btn" data-action="chiudi-finestra">Annulla</button>
          <button type="submit" class="btn primary">${esc(ok)}</button>
        </div>
      </form>`, true);
    const form = $("#dlgForm");
    const primo = form.querySelector("input");
    primo.focus();
    primo.select();
    return new Promise((res) => {
      risolvi = res;
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const v = Object.fromEntries(new FormData(form));
        const err = valida && valida(v);
        if (err) { $("#dlgErr").textContent = err; return; }
        chiudiFinestra(v);
      });
    });
  }
  $("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay" && !finestraBloccata) chiudiFinestra(null); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !finestraBloccata) chiudiFinestra(null); });

  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }


  /* ---------- Gestione menu (modifiche salvate sul dispositivo) ---------- */
  function viewMenu() {
    const agg = MENU.versione && MENU.versione > "2026-10-16"
      ? new Date(MENU.versione).toLocaleString("it-IT", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) : "";
    $("#app").innerHTML = `
      <div class="page-title">
        <h2>Modifica menu</h2>
        <span class="sub">${MENU.drinks.length} voci${agg ? ` · modificato il ${esc(agg)}` : ""}</span>
        <button class="btn primary" data-action="me-nuova">+ Nuova voce</button>
      </div>
      <div class="me-tools">
        <button class="btn" data-action="me-categorie">Categorie</button>
        <button class="btn" data-action="me-esporta">Scarica copia</button>
        <button class="btn" data-action="me-carica">Carica copia</button>
        <button class="btn" data-action="me-originale">Ripristina originale</button>
        <input type="file" id="meFile" accept=".json,application/json" hidden>
      </div>
      <input class="search" id="meQ" type="search" placeholder="Cerca una voce…" value="${esc(ui.meQ)}" autocomplete="off">

      <div class="mlist" id="meLista"></div>`;
    $("#meQ").addEventListener("input", (e) => { ui.meQ = e.target.value; listaMenu(); });
    listaMenu();
  }
  function listaMenu() {
    $("#meChips").innerHTML = chipsHtml(MENU.drinks, ui.meQ.trim() ? "" : ui.meCat, "me-cat");
    const items = filtra(MENU.drinks, ui.meQ, ui.meCat);
    $("#meLista").innerHTML = items.length
      ? items.map((d) => {
          const info = [catNome(d.categoria)];
          if (d.varianti && d.varianti.length) info.push(`${d.varianti.length} varianti`);
          if (haRicetta(d)) info.push("ricetta");
          return `<button class="mrow" data-action="me-modifica" data-id="${esc(d.id)}">
            ${tileHtml(d)}
            <div><div class="n">${esc(d.nome)}</div><div class="s">${esc(info.join(" · "))}</div></div>
            <span class="p">${prezzoLabel(d)}</span>
          </button>`;
        }).join("")
      : `<div class="empty">Nessuna voce trovata.</div>`;
  }

  const numero = (v) => { const n = parseFloat(String(v).replace(",", ".").trim()); return isFinite(n) ? n : NaN; };
  const prezzoTxt = (p) => (p == null ? "" : String(p).replace(".", ","));
  function slug(nome) {
    const base = norm(nome).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "voce";
    let id = base, i = 2;
    while (MENU.drinks.some((d) => d.id === id) || MENU.categorie.some((c) => c.id === id)) id = `${base}-${i++}`;
    return id;
  }
  function rigaEditor(tipo, v = {}) {
    const x = `<button type="button" class="x" data-action="me-del-row" aria-label="Togli">✕</button>`;
    if (tipo === "var") return `<div class="erow">
        <input data-f="nome" placeholder="Nome (es. Aperol)" value="${esc(v.nome || "")}">
        <input data-f="prezzo" placeholder="Prezzo" inputmode="decimal" value="${esc(prezzoTxt(v.prezzo))}">
        <input data-f="info" placeholder="Descrizione breve (facoltativa)" value="${esc(v.info || "")}">${x}</div>`;
    if (tipo === "ingr") return `<div class="erow">
        <input data-f="nome" placeholder="Ingrediente (es. Gin)" value="${esc(v.nome || "")}">
        <input data-f="dose" placeholder="Dose (es. 30 ml)" value="${esc(v.dose || "")}">${x}</div>`;
    return `<div class="erow"><textarea data-f="testo" rows="2" placeholder="Descrivi il passaggio">${esc(v.testo || "")}</textarea>${x}</div>`;
  }

  function apriEditor(id) {
    const d = id ? MENU.drinks.find((x) => x.id === id) : null;
    const v = d || { categoria: ui.meCat !== "tutti" ? ui.meCat : (MENU.categorie[0] || {}).id, emoji: "🍸" };
    const varianti = (v.varianti || []).map((x) => (typeof x === "string" ? { nome: x } : x));
    const campo = (name, label, ph = "") =>
      `<label>${label}<input name="${name}" value="${esc(v[name] || "")}" placeholder="${esc(ph)}"></label>`;
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <form class="dlg editor" id="meForm" autocomplete="off" data-id="${esc(d ? d.id : "")}">
        <h3>${d ? "Modifica voce" : "Nuova voce"}</h3>
        <div class="egrid">
          <label style="grid-column: span 2">Nome<input name="nome" value="${esc(v.nome || "")}" placeholder="es. Negroni"></label>
          <label>Prezzo (€)<input name="prezzo" inputmode="decimal" value="${esc(prezzoTxt(v.prezzo))}" placeholder="es. 10"></label>
          <label>Categoria<select name="categoria">${MENU.categorie.map((c) =>
            `<option value="${esc(c.id)}" ${c.id === v.categoria ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select></label>
          <label>Icona<input name="emoji" value="${esc(v.emoji || "")}" placeholder="🍸" maxlength="8"></label>
          <label style="grid-column: span 2">Nome breve nel menu a tendina<input name="etichetta" value="${esc(v.etichetta || "")}" placeholder="Facoltativo (es. Guinness)"></label>
        </div>
        <label>Descrizione<textarea name="descrizione" rows="2" placeholder="Facoltativa">${esc(v.descrizione || "")}</textarea></label>

        <h4>Varianti</h4>
        <p class="hint">Le scelte che compaiono quando aggiungi la voce a un tavolo (gusti, gin, piccola/media, calice/bottiglia…).
          Prezzo vuoto = prezzo della voce.</p>
        <div id="eVar">${varianti.map((x) => rigaEditor("var", x)).join("")}</div>
        <button type="button" class="btn small add" data-action="me-add-row" data-tipo="var" data-into="eVar">+ Aggiungi variante</button>

        <h4>Ricetta</h4>
        <p class="hint">La voce compare nella sezione Ricette se ha almeno un ingrediente.</p>
        <div class="egrid">
          ${campo("bicchiere", "Bicchiere", "es. Old fashioned")}
          ${campo("ghiaccio", "Ghiaccio", "es. Cubo grande")}
          ${campo("metodo", "Metodo", "es. Stir, Shake, Build")}
          ${campo("guarnizione", "Guarnizione", "es. Scorza d'arancia")}
        </div>
        <label style="margin-top:20px">Ingredienti e dosi</label>
        <div id="eIngr">${(v.ingredienti || []).map((x) => rigaEditor("ingr", x)).join("")}</div>
        <button type="button" class="btn small add" data-action="me-add-row" data-tipo="ingr" data-into="eIngr">+ Aggiungi ingrediente</button>
        <label style="margin-top:20px">Passaggi</label>
        <div id="ePass">${(v.passaggi || []).map((t) => rigaEditor("pass", { testo: t })).join("")}</div>
        <button type="button" class="btn small add" data-action="me-add-row" data-tipo="pass" data-into="ePass">+ Aggiungi passaggio</button>
        <label>Note per lo staff<textarea name="note" rows="2" placeholder="Facoltative">${esc(v.note || "")}</textarea></label>

        <div class="err" id="meErr"></div>
        <div class="dlg-actions">
          ${d ? `<button type="button" class="btn danger" data-action="me-elimina">Elimina voce</button><span class="spacer"></span>` : ""}
          <button type="button" class="btn" data-action="chiudi-finestra">Annulla</button>
          <button type="submit" class="btn primary">Salva</button>
        </div>
      </form>`);
    $("#box").classList.add("wide");
    finestraBloccata = true;
    $("#meForm").addEventListener("submit", (e) => { e.preventDefault(); salvaVoce(); });
    if (!d) $("#meForm [name=nome]").focus();
  }

  async function salvaVoce() {
    const f = $("#meForm");
    const val = (n) => f.elements[n].value.trim();
    const errore = (m) => { $("#meErr").textContent = m; $("#meErr").scrollIntoView({ block: "nearest" }); };
    const nome = val("nome");
    if (!nome) return errore("Scrivi il nome.");
    const prezzo = numero(val("prezzo"));
    if (!(prezzo >= 0)) return errore("Prezzo non valido (es. 10 oppure 6,50).");

    const righe = (id) => [...f.querySelectorAll(`#${id} .erow`)].map((r) =>
      Object.fromEntries([...r.querySelectorAll("[data-f]")].map((el) => [el.dataset.f, el.value.trim()])));
    const varianti = [];
    for (const r of righe("eVar")) {
      if (!r.nome) continue;
      const o = { nome: r.nome };
      if (r.prezzo) {
        const vp = numero(r.prezzo);
        if (!(vp >= 0)) return errore(`Prezzo non valido nella variante «${r.nome}».`);
        if (vp !== prezzo) o.prezzo = vp;
      }
      if (r.info) o.info = r.info;
      varianti.push(Object.keys(o).length === 1 ? o.nome : o);
    }
    const ingredienti = righe("eIngr").filter((r) => r.nome).map((r) => ({ nome: r.nome, dose: r.dose || "" }));
    const passaggi = righe("ePass").map((r) => r.testo).filter(Boolean);

    const id = f.dataset.id;
    const vecchia = id ? MENU.drinks.find((x) => x.id === id) : null;
    const voce = vecchia ? { ...vecchia } : { id: slug(nome) };
    Object.assign(voce, { nome, categoria: val("categoria"), prezzo, emoji: val("emoji") || "🍸" });
    const opzionali = { etichetta: val("etichetta"), descrizione: val("descrizione"), bicchiere: val("bicchiere"), ghiaccio: val("ghiaccio"),
      metodo: val("metodo"), guarnizione: val("guarnizione"), note: val("note") };
    for (const [k, v] of Object.entries(opzionali)) { if (v) voce[k] = v; else delete voce[k]; }
    for (const [k, v] of Object.entries({ varianti, ingredienti, passaggi })) { if (v.length) voce[k] = v; else delete voce[k]; }

    const lista = MENU.drinks.filter((x) => x.id !== voce.id);
    let pos = vecchia && vecchia.categoria === voce.categoria ? MENU.drinks.indexOf(vecchia) : -1;
    if (pos < 0) {
      const ultimo = lista.map((x) => x.categoria).lastIndexOf(voce.categoria);
      pos = ultimo >= 0 ? ultimo + 1 : lista.length;
    }
    lista.splice(pos, 0, voce);
    const nuovo = clona(MENU);
    nuovo.drinks = lista;
    const btn = f.querySelector("[type=submit]");
    try {
      salvaMenu(nuovo);
    } catch (err) {
      return errore(err.message);
    }
    chiudiFinestra(null);
    toast(vecchia ? `Salvato «${nome}»` : `Aggiunto «${nome}»`);
    if (route().view === "menu") viewMenu();
  }

  function apriCategorie() {
    const riga = (c) => {
      const n = MENU.drinks.filter((d) => d.categoria === c.id).length;
      return `<div class="erow" data-id="${esc(c.id || "")}">
        <button type="button" class="mv" data-action="me-cat-su" aria-label="Su">↑</button>
        <input data-f="nome" value="${esc(c.nome || "")}" placeholder="Nome categoria">

        <button type="button" class="x" data-action="me-cat-del" ${n ? "disabled title='Contiene voci'" : ""} aria-label="Elimina">✕</button>
      </div>`;
    };
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <form class="dlg editor" id="catForm" autocomplete="off">
        <h3>Categorie</h3>
        <p class="hint">Rinomina, riordina con ↑ o aggiungi categorie. Si può eliminare solo una categoria vuota.</p>
        <div id="eCat">${MENU.categorie.map(riga).join("")}</div>
        <button type="button" class="btn small add" data-action="me-cat-add">+ Nuova categoria</button>
