        <div class="dlg-actions">
          <button type="button" class="btn" data-action="chiudi-finestra">Annulla</button>
          <button type="submit" class="btn primary">Salva</button>
        </div>
      </form>`);
    finestraBloccata = true;
    apriCategorie.riga = riga;
    $("#catForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const nuove = [];
      for (const r of document.querySelectorAll("#eCat .erow")) {
        const nome = r.querySelector("[data-f=nome]").value.trim();
        if (!nome) { $("#catErr").textContent = "Ogni categoria deve avere un nome."; return; }
        if (nuove.some((c) => norm(c.nome) === norm(nome))) { $("#catErr").textContent = `La categoria «${nome}» è ripetuta.`; return; }
        const vecchia = MENU.categorie.find((c) => c.id === r.dataset.id);
        nuove.push({ ...(vecchia || {}), id: r.dataset.id || slug(nome), nome });
      }
      const nuovo = clona(MENU);
      nuovo.categorie = nuove;
      try { salvaMenu(nuovo); }
      catch (err) { $("#catErr").textContent = err.message; return; }
      chiudiFinestra(null);
      toast("Categorie salvate");
      if (route().view === "menu") viewMenu();
    });
  }

  function esportaMenu() {
    const dati = { app: "dejavu-staff", tipo: "menu", esportato: new Date().toISOString(), ...MENU };
    return salvaFileJson(`menu-dejavu-${new Date().toISOString().slice(0, 10)}.json`, dati, "Menu Déjà Vu");
  }
  // Nell'app Android il file va nella cartella Download del tablet; nel browser si condivide o si scarica
  async function salvaFileJson(nome, dati, titolo) {
    const testo = JSON.stringify(dati, null, 2);
    if (APP) {
      const dove = APP.salvaFile(nome, testo);
      return dove ? messaggio("Copia salvata", `Il file <b>${esc(nome)}</b> è nella cartella <b>${esc(dove)}</b> del tablet.`)
                  : messaggio("Copia non salvata", "Non sono riuscito a salvare il file sul tablet.");
    }
    const blob = new Blob([testo], { type: "application/json" });
    try {
      const file = new File([blob], nome, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: titolo }); return; }
    } catch (err) { if (err && err.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  // «Carica copia»: rimette un menu salvato con «Scarica copia»
  document.addEventListener("change", async (e) => {
    if (e.target.id !== "meFile" || !e.target.files.length) return;
    const file = e.target.files[0];
    let m;
    try { m = JSON.parse(await file.text()); } catch { m = null; }
    if (!menuValido(m)) return messaggio("File non valido", `<b>${esc(file.name)}</b> non è una copia del menu.`);
    const ok = await conferma({
      titolo: "Caricare questa copia del menu?",
      testo: `Il menu attuale viene sostituito con quello di <b>${esc(file.name)}</b> (${m.drinks.length} voci).`,
      ok: "Carica",
    });
    if (!ok) return;
    const nuovo = { gruppi: m.gruppi || MENU.gruppi || [], categorie: m.categorie, drinks: m.drinks, prodotti: MENU.prodotti || [] };
    try { salvaMenu(nuovo); }
    catch (err) { return messaggio("Menu non caricato", esc(err.message)); }
    toast("Menu caricato");
    viewMenu();
  });

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-action^='me-']");
    if (!b) return;
    switch (b.dataset.action) {
      case "me-cat": ui.meCat = b.dataset.cat; ui.meQ = ""; $("#meQ").value = ""; return listaMenu();
      case "me-nuova": return apriEditor(null);
      case "me-modifica": return apriEditor(b.dataset.id);
      case "me-add-row": {
        const box = document.getElementById(b.dataset.into);
        box.insertAdjacentHTML("beforeend", rigaEditor(b.dataset.tipo));
        const nuova = box.lastElementChild.querySelector("input, textarea");
        if (nuova) nuova.focus();
        return;
      }
      case "me-del-row": return b.closest(".erow").remove();
      case "me-elimina": {
        if (!b.classList.contains("fill")) { b.classList.add("fill"); b.textContent = "Tocca ancora per eliminare"; return; }
        const id = $("#meForm").dataset.id;
        const voce = MENU.drinks.find((x) => x.id === id);
        const nuovo = clona(MENU);
        nuovo.drinks = nuovo.drinks.filter((x) => x.id !== id);
        try { salvaMenu(nuovo); }
        catch (err) { b.textContent = "Elimina voce"; b.classList.remove("fill"); $("#meErr").textContent = err.message; return; }
        chiudiFinestra(null);
        toast(`Eliminato «${voce ? voce.nome : ""}»`);
        return viewMenu();
      }
      case "me-categorie": return apriCategorie();
      case "me-cat-add": {
        $("#eCat").insertAdjacentHTML("beforeend", apriCategorie.riga({ nome: "" }));
        return $("#eCat").lastElementChild.querySelector("input").focus();
      }
      case "me-cat-su": {
        const r = b.closest(".erow");
        if (r.previousElementSibling) r.parentNode.insertBefore(r, r.previousElementSibling);
        return;
      }
      case "me-cat-del": return b.closest(".erow").remove();
      case "me-esporta": return esportaMenu();
      case "me-carica": $("#meFile").value = ""; return $("#meFile").click();
      case "me-originale": {
        const ok = await conferma({
          titolo: "Ripristinare il menu originale?",
          testo: "Tutte le modifiche fatte al menu (prezzi, voci nuove, voci tolte) vengono perse.<br>Prima puoi salvarle con <b>Scarica copia</b>.",
          ok: "Ripristina", pericolo: true,
        });
        if (!ok) return;
        try { salvaMenu(await menuOriginale()); }
        catch (err) { return messaggio("Menu non ripristinato", esc(err.message)); }
        toast("Menu originale ripristinato");
        return viewMenu();
      }
    }
  });

  /* ---------- Azioni ---------- */
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-action]");
    if (!b) return;
    const a = b.dataset.action;
    const r = route();
    const t = r.view === "tavolo" ? tavoloById(r.id) : null;
    const riga = t && b.dataset.riga ? t.righe.find((x) => x.id === b.dataset.riga) : null;
    const pay = ui.pagamento && t && ui.pagamento.id === t.id ? ui.pagamento.sel : null;

    switch (a) {
      case "chiudi-finestra": return chiudiFinestra(null);
      case "finestra-ok": return chiudiFinestra(true);
      case "ric-cat": ui.ricCat = b.dataset.cat; ui.ricQ = ""; $("#ricQ").value = ""; return listaRicette();
      case "apri-ricetta": return apriRicetta(b.dataset.id);
      case "zoom": {
        const passo = +b.dataset.passo;
        zoomCarta = passo ? Math.max(0, Math.min(LIVELLI_ZOOM.length - 1, zoomCarta + passo)) : 3;
        try { localStorage.setItem(ZOOM_KEY, String(zoomCarta)); } catch {}
        return applicaZoom();
      }
      case "prod-tipo": ui.prodTipo = b.dataset.tipo; ui.prodQ = ""; $("#prodQ").value = ""; return listaProdotti();
      case "apri-prodotto": return apriProdotto(b.dataset.id);
      case "slide": mostraSlide(+b.dataset.i); return avviaSlide();
      case "aggiorna": return controllaAggiornamenti();
      case "scendi": return window.scrollTo({ top: $(".hero").offsetHeight, behavior: "smooth" });
      case "nuovo-tavolo": return nuovoTavolo();
      case "apri-tavolo": location.hash = "#tavolo/" + encodeURIComponent(b.dataset.id); return;
    }
    if (!t) return;

    switch (a) {
      case "acc": {
        ui.apriGruppo = ui.apriGruppo === b.dataset.g ? null : b.dataset.g;
        const g = gruppi().find((x) => x.id === ui.apriGruppo);
        ui.apriCat = g && g.categorie.length > 1 ? null : ui.apriCat;
        listaPicker(t);
        const el = document.getElementById("acc-" + ui.apriGruppo);
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
        return;
      }
      case "acc-cat":
        ui.apriCat = ui.apriCat === b.dataset.c ? null : b.dataset.c;
        ui.apriVoce = null;
        return listaPicker(t);
      case "acc-voce":
        ui.apriVoce = ui.apriVoce === b.dataset.id ? null : b.dataset.id;
        return listaPicker(t);

      case "aggiungi": {
        const d = drinkById(b.dataset.id);
        if (!d) return;
        const i = b.dataset.v === "" || b.dataset.v == null ? null : +b.dataset.v;
        if (i == null && d.varianti && d.varianti.length) return sceltaVariante(d);
        const prezzo = i == null ? d.prezzo : varPrezzo(d, d.varianti[i]);
        aggiungiRiga(t, { drinkId: d.id, nome: nomeRiga(d, i), prezzoCent: cent(prezzo) });
        const nb = document.querySelector(`.pbtn[data-id="${CSS.escape(d.id)}"][data-v="${i == null ? "" : i}"]`);
        if (nb) { nb.classList.add("flash"); setTimeout(() => nb.classList.remove("flash"), 250); }
        if (matchMedia("(max-width: 899px)").matches) toast(`+ ${nomeRiga(d, i)}`);
        return;
      }

      case "aggiungi-var": {
        const d = drinkById(b.dataset.id);
        const v = d && d.varianti[+b.dataset.i];
        if (!v) return;
        const nome = `${d.nome} · ${varNome(v)}`;
        chiudiFinestra(null);
        aggiungiRiga(t, { drinkId: d.id, nome, prezzoCent: cent(varPrezzo(d, v)) });
        toast(`+ ${nome}`);
        return;
      }

      case "voce-libera": {
        const v = await chiedi({
          titolo: "Voce libera",
          campi: [
            { name: "nome", label: "Descrizione", placeholder: "es. Patatine, Shot, Acqua…" },
            { name: "prezzo", label: "Prezzo (€)", placeholder: "es. 3,50", inputmode: "decimal" },
          ],
          ok: "Aggiungi",
          valida: (v) => {
            if (!v.nome.trim()) return "Scrivi una descrizione.";
            const p = parseFloat(v.prezzo.replace(",", "."));
            if (!(p >= 0)) return "Prezzo non valido.";
          },
        });
        if (!v) return;
        return aggiungiRiga(t, { nome: v.nome.trim(), prezzoCent: Math.round(parseFloat(v.prezzo.replace(",", ".")) * 100) });
      }

      case "inc": if (riga) { riga.qty++; salva(); aggiornaTavolo(t); } return;
      case "dec":
        if (!riga) return;
        riga.qty--;
        if (riga.qty <= 0) t.righe = t.righe.filter((x) => x !== riga);
        salva(); aggiornaTavolo(t);
        return;

      case "rinomina": {
        const v = await chiedi({
          titolo: "Rinomina tavolo",
          campi: [{ name: "nome", label: "Nome del tavolo", value: t.nome }],
          ok: "Salva",
          valida: (v) => validaNome(v.nome, t.id),
        });
        if (!v) return;
        t.nome = v.nome.trim(); salva();
        $("#tNome").textContent = t.nome;
        return;
      }

      case "pane":
        ui.pane = b.dataset.pane; aggiornaTavolo(t); window.scrollTo(0, 0);
        return;

      case "paga-separato": ui.pagamento = { id: t.id, sel: {} }; return aggiornaTavolo(t);
      case "pay-annulla": ui.pagamento = null; return aggiornaTavolo(t);
      case "pay-inc": if (pay && riga) { pay[riga.id] = Math.min(riga.qty, (pay[riga.id] || 0) + 1); aggiornaTavolo(t); } return;
      case "pay-dec": if (pay && riga) { pay[riga.id] = Math.max(0, (pay[riga.id] || 0) - 1); aggiornaTavolo(t); } return;
      case "pay-riga": if (pay && riga) { pay[riga.id] = pay[riga.id] === riga.qty ? 0 : riga.qty; aggiornaTavolo(t); } return;
      case "pay-tutto": if (pay) { t.righe.forEach((x) => (pay[x.id] = x.qty)); aggiornaTavolo(t); } return;

      case "pay-conferma": {
        if (!pay) return;
        const incassato = t.righe.reduce((s, x) => s + (pay[x.id] || 0) * x.prezzoCent, 0);
        registraIncasso(t, t.righe.map((x) => ({ ...x, qty: pay[x.id] || 0 })));
        t.righe.forEach((x) => (x.qty -= pay[x.id] || 0));
        t.righe = t.righe.filter((x) => x.qty > 0);
        ui.pagamento = null;
        salva(); aggiornaTavolo(t);
        toast(`Incassati ${euro(incassato)}`);
        if (!t.righe.length) {
          const ok = await conferma({ titolo: "Tavolo saldato", testo: `<b>${esc(t.nome)}</b> ha pagato tutto. Vuoi chiudere il tavolo?`, ok: "Chiudi tavolo" });
          if (ok) eliminaTavolo(t);
        }
        return;
      }

      case "chiudi-tavolo": {
        const tot = totale(t);
        const ok = await conferma({
          titolo: `Chiudere «${t.nome}»?`,
          testo: tot
            ? `Il tavolo verrà eliminato con tutti gli ordini.<br>Totale da incassare: <b style="color:var(--text)">${euro(tot)}</b>`
            : "Il tavolo verrà eliminato.",
          ok: tot ? `Pagato ${euro(tot)} · Chiudi` : "Chiudi tavolo",
          pericolo: true,
        });
        if (!ok) return;
        registraIncasso(t, t.righe); // «Chiudi tavolo» = ha pagato tutto quello che resta
        eliminaTavolo(t);
        return;
      }
    }
  });

  /* ---------- Incassi e cronologia ----------
     Ogni incasso (Paga separato → Incassa, oppure Chiudi tavolo = pagato tutto) resta nel tavolo
     in t.incassi; quando il tavolo si chiude passa nella cronologia. */
  function registraIncasso(t, righe) {
    const pagate = righe.filter((r) => r.qty > 0).map((r) => {
      const d = r.drinkId ? drinkById(r.drinkId) : null;
      return { drinkId: r.drinkId || null, nome: r.nome, categoria: d ? d.categoria : "", prezzoCent: r.prezzoCent, qty: r.qty };
    });
    if (!pagate.length) return;
    if (!t.incassi) t.incassi = [];
    t.incassi.push({ ts: Date.now(), cent: pagate.reduce((n, r) => n + r.qty * r.prezzoCent, 0), righe: pagate });
    salva();
  }

  function eliminaTavolo(t) {
    // nella cronologia finiscono i tavoli che hanno pagato qualcosa
    if (t.incassi && t.incassi.length) {
      const voce = { id: t.id, nome: t.nome, aperto: t.creato, chiuso: Date.now(), incassi: t.incassi };
      if (archivio.archivia(voce)) Crono.aggiungi(voce);
      else alert("Attenzione: il tavolo è chiuso, ma non sono riuscito a salvarlo nella cronologia.");
    }
    tavoli = tavoli.filter((x) => x.id !== t.id);
    salva();
    toast(`Tavolo «${t.nome}» chiuso`);
    location.hash = "#tavoli";
  }

  /* ---------- Archivio della cronologia ----------
     App Android: un file per mese sul tablet (cronologia/AAAA-MM.json, con la copia .bak), come Reef.
     Browser: nella memoria del browser, una chiave per mese. */
  const CRONO_KEY = "dejavu.staff.cronologia.";
  const archivio = APP ? {
    leggi() { try { const v = JSON.parse(APP.leggiCronologia()); return Array.isArray(v) ? v : []; } catch { return []; } },
    archivia: (voce) => APP.archivia(JSON.stringify(voce)),
    elimina: (id) => APP.eliminaDaCronologia(id),
  } : {
    mesi() { try { return Object.keys(localStorage).filter((k) => k.startsWith(CRONO_KEY)).sort(); } catch { return []; } },
    lista(k) { try { const l = JSON.parse(localStorage.getItem(k)); return Array.isArray(l) ? l : []; } catch { return []; } },
    leggi() { return this.mesi().flatMap((k) => this.lista(k)); },
    archivia(voce) {
      const d = new Date(voce.chiuso);
      const k = CRONO_KEY + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      try { localStorage.setItem(k, JSON.stringify([...this.lista(k), voce])); return true; } catch { return false; }
    },
    elimina(id) {
      for (const k of this.mesi()) {
        const l = this.lista(k), nuova = l.filter((v) => v.id !== id);
        if (nuova.length === l.length) continue;
        try { localStorage.setItem(k, JSON.stringify(nuova)); return true; } catch { return false; }
      }
      return false;
    },
  };
  let vociCrono = null; // tavoli chiusi, letti la prima volta che servono
  const Crono = {
    voci: () => vociCrono || (vociCrono = archivio.leggi()),
    aggiungi: (v) => { if (vociCrono) vociCrono.push(v); },
    elimina: (id) => {
      if (!archivio.elimina(id)) return false;
      if (vociCrono) vociCrono = vociCrono.filter((v) => v.id !== id);
      return true;
    },
  };

  /* ---------- Cronologia: tavoli chiusi, incassi per serata, prodotti più venduti ----------
     Una «serata» va dalle 8:00 alle 7:59 del giorno dopo: un tavolo pagato all'1:30 di notte conta
     nella serata del giorno prima. Contano anche gli incassi dei tavoli ancora aperti. */
  const ORA_CAMBIO = 8;
  const cr = {
    pagina: "serate",   // serate | prodotti | tavoli
    tipo: "settimana",  // serata | settimana | mese | anno | tutto
    rif: Date.now(),    // un momento dentro il periodo scelto
    cerca: "", ordine: "pezzi", gruppo: "",
    barre: [], apribile: false, barra: -1, // grafico: colonna toccata
  };
  // la serata di un istante, come data a mezzanotte (es. venerdì 17 per l'1:30 di sabato 18)
  const giornoSerata = (ts) => { const d = new Date(ts - ORA_CAMBIO * 3600000); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  const chiaveG = (d) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  const serataDi = (ts) => chiaveG(giornoSerata(ts));
  const daChiave = (k) => new Date(Math.floor(k / 10000), Math.floor(k / 100) % 100 - 1, k % 100);
  const piuGiorni = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const mezzogiorno = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12).getTime();
  const dataIt = (d, opt) => d.toLocaleDateString("it-IT", opt);
  const maiuscola = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const plurale = (n, uno, tanti) => `${n} ${n === 1 ? uno : tanti}`;
  const oraIt = (ts) => new Date(ts).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  function durata(ms) {
    const min = Math.max(0, Math.round(ms / 60000));
    return min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${min % 60} min`;
  }

  function intervallo() {
    const b = giornoSerata(cr.rif);
    if (cr.tipo === "serata") return { da: b, a: b };
    if (cr.tipo === "settimana") { const lun = piuGiorni(b, -((b.getDay() + 6) % 7)); return { da: lun, a: piuGiorni(lun, 6) }; }
    if (cr.tipo === "mese") return { da: new Date(b.getFullYear(), b.getMonth(), 1), a: new Date(b.getFullYear(), b.getMonth() + 1, 0) };
    if (cr.tipo === "anno") return { da: new Date(b.getFullYear(), 0, 1), a: new Date(b.getFullYear(), 11, 31) };
    const tutti = tuttiIncassi();
    return { da: tutti.length ? daChiave(tutti[0].s) : b, a: giornoSerata(Date.now()) };
  }
  const dentro = (k, iv) => k >= chiaveG(iv.da) && k <= chiaveG(iv.a);
  function spostaPeriodo(n) {
    const b = giornoSerata(cr.rif);
    let d;
    if (cr.tipo === "serata") d = piuGiorni(b, n);
    else if (cr.tipo === "settimana") d = piuGiorni(b, 7 * n);
    else if (cr.tipo === "mese") d = new Date(b.getFullYear(), b.getMonth() + n, 1);
    else if (cr.tipo === "anno") d = new Date(b.getFullYear() + n, 0, 1);
    else return;
    cr.rif = mezzogiorno(d);
  }
  function apriSerata(k) { cr.tipo = "serata"; cr.rif = mezzogiorno(daChiave(k)); }
  const puoAvanti = () => cr.tipo !== "tutto" && chiaveG(intervallo().a) < serataDi(Date.now());
  function etichettaSerata(k) {
    const nome = maiuscola(dataIt(daChiave(k), { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
    return k === serataDi(Date.now()) ? nome + " · stasera" : k === serataDi(Date.now() - 86400000) ? nome + " · ieri" : nome;
  }
  function etichettaPeriodo() {
    const iv = intervallo();
    if (cr.tipo === "serata") return etichettaSerata(chiaveG(iv.da));
    if (cr.tipo === "settimana") {
      const stessoMese = iv.da.getMonth() === iv.a.getMonth();
      return dataIt(iv.da, stessoMese ? { day: "numeric" } : { day: "numeric", month: "long" }) + " – " + dataIt(iv.a, { day: "numeric", month: "long", year: "numeric" });
    }
    if (cr.tipo === "mese") return maiuscola(dataIt(iv.da, { month: "long", year: "numeric" }));
    if (cr.tipo === "anno") return String(iv.da.getFullYear());
    return "Tutto il periodo";
  }

  // tutti gli incassi (tavoli chiusi + tavoli ancora aperti), in ordine di tempo; s = serata
  function tuttiIncassi() {
    const out = [];
    const da = (t, aperto) => (t.incassi || []).forEach((i) => out.push({ ts: i.ts, s: serataDi(i.ts), cent: i.cent, righe: i.righe, tavolo: t, aperto }));
    Crono.voci().forEach((v) => da(v, false));
    tavoli.forEach((t) => da(t, true));
    return out.sort((x, y) => x.ts - y.ts);
  }
  function incassiPeriodo() { const iv = intervallo(); return tuttiIncassi().filter((i) => dentro(i.s, iv)); }
  const totaleTavolo = (v) => (v.incassi || []).reduce((n, i) => n + i.cent, 0);
  const pezziTavolo = (v) => (v.incassi || []).reduce((n, i) => n + i.righe.reduce((m, r) => m + r.qty, 0), 0);

  function riepilogo(inc) {
    const tav = {}, serate = {}, ore = {};
    let cent = 0, migliore = null, punta = null;
    inc.forEach((i) => {
      cent += i.cent;
      tav[i.tavolo.id] = true;
      serate[i.s] = (serate[i.s] || 0) + i.cent;
      const h = new Date(i.ts).getHours();
      ore[h] = (ore[h] || 0) + i.cent;
    });
    Object.keys(serate).forEach((k) => { if (!migliore || serate[k] > migliore.cent) migliore = { k: +k, cent: serate[k] }; });
    Object.keys(ore).forEach((h) => { if (!punta || ore[h] > punta.cent) punta = { h: +h, cent: ore[h] }; });
    const nT = Object.keys(tav).length, nS = Object.keys(serate).length;
    return {
      cent, tavoli: nT, serate: nS, migliore, punta,
      mediaTavolo: nT ? Math.round(cent / nT) : 0, mediaSerata: nS ? Math.round(cent / nS) : 0,
    };
  }
  // colonne del grafico: per ora (serata), per serata (settimana, mese), per mese (anno, tutto)
  function serie(inc) {
    const iv = intervallo();
    const barre = [];
    if (cr.tipo === "serata") {
      for (let k = 0; k < 24; k++) {
        const h = String((ORA_CAMBIO + k) % 24).padStart(2, "0");
        barre.push({ etichetta: String(+h), titolo: `${h}:00 – ${h}:59`, cent: 0 });
      }
      inc.forEach((i) => { barre[(new Date(i.ts).getHours() - ORA_CAMBIO + 24) % 24].cent += i.cent; });
      return { titolo: "Incasso per ora", barre };
    }
    const pos = {};
    if (cr.tipo === "settimana" || cr.tipo === "mese") {
      for (let d = iv.da; d <= iv.a; d = piuGiorni(d, 1)) {
        pos[chiaveG(d)] = barre.length;
        barre.push({
          etichetta: cr.tipo === "settimana" ? dataIt(d, { weekday: "short", day: "numeric" }) : String(d.getDate()),
          titolo: etichettaSerata(chiaveG(d)), cent: 0, serata: chiaveG(d),
        });
      }
      inc.forEach((i) => { if (pos[i.s] !== undefined) barre[pos[i.s]].cent += i.cent; });
      return { titolo: "Incasso per serata", barre };
    }
    for (let m = new Date(iv.da.getFullYear(), iv.da.getMonth(), 1); m <= iv.a; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
      pos[m.getFullYear() * 100 + m.getMonth()] = barre.length;
      barre.push({
        etichetta: dataIt(m, cr.tipo === "anno" ? { month: "short" } : { month: "short", year: "2-digit" }),
        titolo: maiuscola(dataIt(m, { month: "long", year: "numeric" })), cent: 0,
      });
    }
    inc.forEach((i) => {
      const d = daChiave(i.s), p = pos[d.getFullYear() * 100 + d.getMonth()];
      if (p !== undefined) barre[p].cent += i.cent;
    });
    return { titolo: "Incasso per mese", barre };
  }
  function classificaSerate(inc) {
    const m = {};
    inc.forEach((i) => {
      if (!m[i.s]) m[i.s] = { k: i.s, cent: 0, tavoli: {} };
      m[i.s].cent += i.cent;
      m[i.s].tavoli[i.tavolo.id] = true;
    });
    return Object.values(m).map((x) => ({ k: x.k, cent: x.cent, tavoli: Object.keys(x.tavoli).length })).sort((a, b) => b.cent - a.cent);
  }
  // tavoli chiusi del periodo (per serata di apertura), raggruppati per serata, dal più recente
  function gruppiTavoli() {
    const iv = intervallo();
    const q = norm(cr.cerca.trim());
    const scelti = Crono.voci().filter((v) => {
      if (!dentro(serataDi(v.aperto), iv)) return false;
      if (!q) return true;
      return norm(v.nome).includes(q) || v.incassi.some((i) => i.righe.some((r) => norm(r.nome).includes(q)));
    }).sort((a, b) => b.chiuso - a.chiuso);
    const gruppi = [];
    scelti.forEach((v) => {
      const s = serataDi(v.aperto);
      let g = gruppi[gruppi.length - 1];
      if (!g || g.k !== s) gruppi.push((g = { k: s, tavoli: [], cent: 0 }));
      g.tavoli.push(v);
      g.cent += totaleTavolo(v);
    });
    return gruppi;
  }
  // prodotti presi da un tavolo, sommando i suoi pagamenti
  function prodottiTavolo(v) {
    const m = new Map();
    (v.incassi || []).forEach((i) => i.righe.forEach((r) => {
      const k = r.nome + "|" + r.prezzoCent;
      if (!m.has(k)) m.set(k, { nome: r.nome, prezzoCent: r.prezzoCent, qty: 0 });
      m.get(k).qty += r.qty;
    }));
    return [...m.values()];
  }
  const gruppoDi = (cat) => (gruppi().find((g) => g.categorie.includes(cat)) || {}).id || "";
  function prodottiVenduti() {
    const m = {};
    incassiPeriodo().forEach((i) => i.righe.forEach((r) => {
      const cat = r.categoria || ((r.drinkId && drinkById(r.drinkId)) || {}).categoria || "";
      if (cr.gruppo && gruppoDi(cat) !== cr.gruppo) return;
      if (!m[r.nome]) m[r.nome] = { nome: r.nome, drinkId: r.drinkId, qty: 0, cent: 0 };
      m[r.nome].qty += r.qty;
      m[r.nome].cent += r.qty * r.prezzoCent;
    }));
    const k = cr.ordine === "incasso" ? "cent" : "qty";
    return Object.values(m).sort((a, b) => b[k] - a[k] || b.cent - a.cent || a.nome.localeCompare(b.nome));
  }
  // voci del menu mai vendute nel periodo (rispettando il filtro per gruppo)
  function maiVenduti(venduti) {
    const ids = new Set(venduti.map((p) => p.drinkId).filter(Boolean));
    return MENU.drinks.filter((d) => !ids.has(d.id) && (!cr.gruppo || gruppoDi(d.categoria) === cr.gruppo));
  }
  function stasera() {
    const oggi = serataDi(Date.now()), tav = new Set();
    let cent = 0;
    tuttiIncassi().forEach((i) => { if (i.s === oggi) { cent += i.cent; tav.add(i.tavolo.id); } });
    return { cent, tavoli: tav.size };
  }

  /* ---------- Cronologia: pagine ---------- */
  function viewCronologia() {
    const pagine = [["serate", "Serate"], ["prodotti", "Prodotti più venduti"], ["tavoli", "Tavoli chiusi"]];
    const tipi = [["serata", "Serata"], ["settimana", "Settimana"], ["mese", "Mese"], ["anno", "Anno"], ["tutto", "Tutto"]];
    $("#app").innerHTML = `
      <div class="page-title">
        <h2>Cronologia</h2>
        <span class="sub">le serate vanno dalle ${ORA_CAMBIO}:00 alle ${ORA_CAMBIO - 1}:59 del giorno dopo</span>
        <button class="btn" data-action="cr-esporta">Scarica copia</button>
      </div>
      <div class="seg">${pagine.map(([id, t]) => `<button class="${cr.pagina === id ? "on" : ""}" data-action="cr-pagina" data-p="${id}">${t}</button>`).join("")}</div>
      <div class="cr-periodo">
        <div class="chips">${tipi.map(([id, t]) => `<button class="chip ${cr.tipo === id ? "on" : ""}" data-action="cr-tipo" data-t="${id}">${t}</button>`).join("")}</div>
        <div class="cr-nav">
          <button class="btn icona" data-action="cr-sposta" data-n="-1" ${cr.tipo === "tutto" ? "disabled" : ""} aria-label="Periodo precedente">‹</button>
          <div class="cr-etichetta">${esc(etichettaPeriodo())}</div>
          <button class="btn icona" data-action="cr-sposta" data-n="1" ${puoAvanti() ? "" : "disabled"} aria-label="Periodo successivo">›</button>
          <button class="btn" data-action="cr-oggi" ${cr.tipo === "tutto" ? "disabled" : ""}>Oggi</button>
        </div>
      </div>
      <div id="crCorpo"></div>`;
    if (cr.pagina === "prodotti") crProdotti();
    else if (cr.pagina === "tavoli") crTavoli();
    else crSerate();
  }
  const stat = (etichetta, valore, nota = "", principale = false) => `
    <div class="stat ${principale ? "main" : ""}">
      <span class="dv-caps">${esc(etichetta)}</span>
      <b class="${String(valore).length > 12 ? "lungo" : ""}">${esc(valore)}</b>
      ${nota ? `<small>${esc(nota)}</small>` : ""}
    </div>`;
  const boxCrono = (titolo, corpo, extra = "") =>
    `<div class="panel cr-box"><div class="cr-box-h"><span class="dv-caps">${esc(titolo)}</span>${extra}</div>${corpo}</div>`;

  function crSerate() {
    const inc = incassiPeriodo();
    const r = riepilogo(inc);
    const s = serie(inc);
    const singola = cr.tipo === "serata";
    const classifica = singola ? [] : classificaSerate(inc);
    cr.barre = s.barre;
    cr.apribile = cr.tipo === "settimana" || cr.tipo === "mese";
    const righe = classifica.slice(0, 10).map((x, i) => `
      <button class="cr-riga" data-action="cr-serata" data-k="${x.k}">
        <span class="pos">${i + 1}</span>
        <span class="n">${esc(etichettaSerata(x.k))}</span>
        <span class="i">${plurale(x.tavoli, "tavolo", "tavoli")}</span>
        <span class="barra"><i style="width:${(x.cent / classifica[0].cent) * 100}%"></i></span>
        <span class="v">${euro(x.cent)}</span>
      </button>`).join("");
    $("#crCorpo").innerHTML = `
      <div class="stats">
        ${stat("Incasso", euro(r.cent), plurale(r.tavoli, "tavolo", "tavoli"), true)}
        ${stat("Media per tavolo", r.tavoli ? euro(r.mediaTavolo) : "—")}
        ${singola
          ? stat("Ora di punta", r.punta ? String(r.punta.h).padStart(2, "0") + ":00" : "—", r.punta ? euro(r.punta.cent) + " incassati" : "")
          : stat("Media per serata", r.serate ? euro(r.mediaSerata) : "—", plurale(r.serate, "serata", "serate") + " con incassi")
            + stat("Serata migliore", r.migliore ? euro(r.migliore.cent) : "—", r.migliore ? etichettaSerata(r.migliore.k) : "")}
      </div>
      ${boxCrono(s.titolo, `<div id="crGrafico"></div>${r.cent ? "" : `<div class="empty" style="padding:14px 0 4px">Nessun incasso in questo periodo.</div>`}`,
        `<span class="hint">Tocca una colonna per vedere l'importo${cr.apribile ? ", toccala di nuovo per aprire la serata" : ""}</span>`)}
      ${classifica.length ? boxCrono("Serate migliori", righe) : ""}
      ${singola && r.tavoli ? `<button class="btn" data-action="cr-pagina" data-p="tavoli">Vedi i tavoli di questa serata</button>` : ""}`;
    crGrafico();
  }

  // fondo scala «tondo» (1, 2, 2,5, 5 × 10^n euro) diviso in 4 righe
  function scalaGrafico(max) {
    const e = max / 100 / 4;
    if (e <= 0) return 400;
    const p = Math.pow(10, Math.floor(Math.log10(e)));
    return [1, 2, 2.5, 5, 10].map((k) => k * p).find((x) => x >= e) * 400;
  }
  function crGrafico() {
    const el = $("#crGrafico");
    if (!el) return;
    const barre = cr.barre;
    const scala = scalaGrafico(Math.max(0, ...barre.map((b) => b.cent)));
    // un'etichetta dell'asse ogni «ogni» colonne, così non si sovrappongono
    const ogni = Math.max(1, Math.ceil((barre.length * 44) / Math.max(1, el.clientWidth - 64)));
    const sel = barre[cr.barra];
    const dove = (cr.barra + 0.5) / barre.length;
    el.innerHTML = `
      <div class="graf">
        ${[0, 1, 2, 3, 4].map((i) => `<div class="graf-riga" style="bottom:${i * 25}%"><span>${Math.round(scala * i / 400).toLocaleString("it-IT")} €</span></div>`).join("")}
        <div class="graf-col">${barre.map((b, i) => `
          <button class="${i === cr.barra ? "on" : ""}" data-action="cr-barra" data-i="${i}" aria-label="${esc(b.titolo)}: ${euro(b.cent)}">
            <i style="height:${b.cent ? Math.max(0.8, (b.cent / scala) * 100) : 0}%"></i>
            <span class="${i % ogni ? "nascosta" : ""}">${esc(b.etichetta)}</span>
          </button>`).join("")}</div>
        ${sel ? `<div class="graf-tip" style="left:${dove * 100}%;transform:translateX(-${dove < 0.2 ? 15 : dove > 0.8 ? 85 : 50}%)">
          <small>${esc(sel.titolo)}</small><b>${euro(sel.cent)}</b>${cr.apribile && sel.cent ? "<small>Tocca ancora per aprire</small>" : ""}</div>` : ""}
      </div>`;
  }

  function crProdotti() {
    const lista = prodottiVenduti();
    const mai = maiVenduti(lista);
    const pezzi = lista.reduce((n, p) => n + p.qty, 0);
    const cent = lista.reduce((n, p) => n + p.cent, 0);
    const k = cr.ordine === "incasso" ? "cent" : "qty";
    const massimo = lista.length ? lista[0][k] || 1 : 1;
    const meno = lista.length > 10 ? lista.slice(-10).reverse() : [];
    const riga = (p, pos) => `
      <div class="cr-riga">
        <span class="pos">${pos}</span>
        ${tileHtml(p.drinkId ? drinkById(p.drinkId) : null)}
        <span class="n">${esc(p.nome)}</span>
        <span class="barra"><i style="width:${(p[k] / massimo) * 100}%"></i></span>
        <span class="q">${p.qty} pz</span>
        <span class="v">${euro(p.cent)}</span>
      </div>`;
    const chip = (azione, attr, val, on, testo) => `<button class="chip ${on ? "on" : ""}" data-action="${azione}" data-${attr}="${esc(val)}">${esc(testo)}</button>`;
    $("#crCorpo").innerHTML = `
      <div class="stats">
        ${stat("Pezzi venduti", String(pezzi), euro(cent) + " incassati", true)}
        ${stat("Prodotti diversi", String(lista.length))}
        ${stat("Il più venduto", lista.length ? lista[0].nome : "—", lista.length ? `${lista[0].qty} pezzi · ${euro(lista[0].cent)}` : "")}
        ${stat("Mai venduti", String(mai.length), "voci del menu senza vendite")}
      </div>
      <div class="chips">${chip("cr-gruppo", "g", "", !cr.gruppo, "Tutto il menu")}${gruppi().map((g) => chip("cr-gruppo", "g", g.id, cr.gruppo === g.id, g.nome)).join("")}</div>
      <div class="cr-ordina"><span>Ordina per</span>${chip("cr-ordine", "o", "pezzi", cr.ordine === "pezzi", "Pezzi venduti")}${chip("cr-ordine", "o", "incasso", cr.ordine === "incasso", "Incasso")}</div>
      ${boxCrono("Classifica", lista.length ? lista.map((p, i) => riga(p, i + 1)).join("") : `<div class="empty" style="padding:16px">Nessun prodotto venduto in questo periodo.</div>`)}
      ${meno.length ? boxCrono("Meno venduti", meno.map((p, i) => riga(p, lista.length - i)).join("")) : ""}
      ${mai.length ? boxCrono(`Mai venduti in questo periodo · ${mai.length}`, `<div class="vtags">${mai.map((d) => `<span>${esc(d.nome)}</span>`).join("")}</div>`) : ""}`;
  }

  function crTavoli() {
    const aperti = tavoli.length;
    $("#crCorpo").innerHTML = `
      <input class="search" id="crQ" type="search" placeholder="Cerca un tavolo o un prodotto…" value="${esc(cr.cerca)}" autocomplete="off">
      ${aperti ? `<p class="cr-nota">${aperti === 1 ? "1 tavolo è ancora aperto: compare qui quando lo chiudi." : `${aperti} tavoli sono ancora aperti: compaiono qui quando li chiudi.`}</p>` : ""}
      <div id="crLista"></div>`;
    $("#crQ").addEventListener("input", (e) => { cr.cerca = e.target.value; crListaTavoli(); });
    crListaTavoli();
  }
  function crListaTavoli() {
    const gruppiT = gruppiTavoli();
    const q = cr.cerca.trim();
    $("#crLista").innerHTML = gruppiT.length
      ? gruppiT.map((g) => `
        <div class="cr-gruppo">
          <div class="cr-gruppo-h"><h3>${esc(etichettaSerata(g.k))}</h3><span>${plurale(g.tavoli.length, "tavolo", "tavoli")} · ${euro(g.cent)}</span></div>
          <div class="tgrid">${g.tavoli.map((v) => `
            <button class="tcard" data-action="cr-tavolo" data-id="${esc(v.id)}">
              <div class="n">${esc(v.nome)}</div>
              <div class="i">${oraIt(v.aperto)} – ${oraIt(v.chiuso)} · ${durata(v.chiuso - v.aperto)}</div>
              <div class="i">${plurale(pezziTavolo(v), "articolo", "articoli")}${v.incassi.length > 1 ? ` · pagato in ${v.incassi.length} volte` : ""}</div>
              <div class="t">${euro(totaleTavolo(v))}</div>
            </button>`).join("")}</div>
        </div>`).join("")
      : `<div class="empty"><div class="big">🕰️</div>${q ? `Nessun tavolo trovato per «${esc(q)}».` : "Nessun tavolo chiuso in questo periodo."}</div>`;
  }

  // Dettaglio di un tavolo chiuso: cosa ha preso, quando ha pagato, quanto
  function apriStorico(id) {
    const v = Crono.voci().find((x) => x.id === id);
    if (!v) return;
    const tabella = (righe) => `<table class="ingr cr-tab">${righe}</table>`;
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <div class="dlg" id="storico" data-id="${esc(v.id)}">
        <h3 style="padding-right:48px">${esc(v.nome)}</h3>
        <p>${esc(etichettaSerata(serataDi(v.aperto)))}<br>
          aperto alle ${oraIt(v.aperto)} · chiuso alle ${oraIt(v.chiuso)} · ${durata(v.chiuso - v.aperto)}</p>
        <h4 class="cr-sez">Ordine</h4>
        ${tabella(prodottiTavolo(v).map((p) => `<tr><td>${esc(p.nome)}</td><td class="q">${p.qty} × ${euro(p.prezzoCent)}</td><td>${euro(p.qty * p.prezzoCent)}</td></tr>`).join(""))}
        <div class="totale" style="padding:16px 0 4px"><span>Totale</span><span class="v">${euro(totaleTavolo(v))}</span></div>
        ${v.incassi.length > 1 ? `<h4 class="cr-sez">Pagamenti</h4>${tabella(v.incassi.map((i) => `<tr>
            <td class="pag">${oraIt(i.ts)} · ${esc(i.righe.map((r) => `${r.qty}× ${r.nome}`).join(", "))}</td><td></td><td>${euro(i.cent)}</td></tr>`).join(""))}` : ""}
        <div class="err" id="stErr"></div>
        <div class="dlg-actions">
          <button class="btn danger" data-action="cr-elimina">Elimina dalla cronologia</button>
          <button class="btn primary" data-action="chiudi-finestra">Chiudi</button>
        </div>
      </div>`);
  }

  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-action^='cr-']");
    if (!b) return;
    const ridisegna = () => { cr.barra = -1; viewCronologia(); };
    switch (b.dataset.action) {
      case "cr-pagina": cr.pagina = b.dataset.p; window.scrollTo(0, 0); return ridisegna();
      case "cr-tipo": cr.tipo = b.dataset.t; cr.rif = Date.now(); return ridisegna();
      case "cr-sposta": spostaPeriodo(+b.dataset.n); return ridisegna();
      case "cr-oggi": cr.rif = Date.now(); return ridisegna();
      case "cr-serata": apriSerata(+b.dataset.k); window.scrollTo(0, 0); return ridisegna();
      case "cr-barra": {
        const i = +b.dataset.i, barra = cr.barre[i];
        if (cr.barra === i && cr.apribile && barra && barra.cent) { apriSerata(barra.serata); return ridisegna(); }
        cr.barra = i;
        return crGrafico();
      }
      case "cr-gruppo": cr.gruppo = b.dataset.g; return crProdotti();
      case "cr-ordine": cr.ordine = b.dataset.o; return crProdotti();
      case "cr-tavolo": return apriStorico(b.dataset.id);
      case "cr-elimina": {
        if (!b.classList.contains("fill")) { b.classList.add("fill"); b.textContent = "Tocca ancora per eliminare"; return; }
        const v = Crono.voci().find((x) => x.id === $("#storico").dataset.id);
        if (!v || !Crono.elimina(v.id)) {
          b.classList.remove("fill"); b.textContent = "Elimina dalla cronologia";
          $("#stErr").textContent = "Non sono riuscito a modificare la cronologia.";
          return;
        }
        chiudiFinestra(null);
        toast(`Tavolo «${v.nome}» tolto dalla cronologia`);
        return viewCronologia();
      }
      case "cr-esporta":
        return salvaFileJson(`cronologia-dejavu-${new Date().toISOString().slice(0, 10)}.json`,
          { app: "dejavu-staff", tipo: "cronologia", esportato: new Date().toISOString(), tavoli: Crono.voci() }, "Cronologia Déjà Vu");
    }
  });

  // Aggiorna i tempi "aperto da…" ogni 30 secondi
  setInterval(() => {
    if ($("#overlay").classList.contains("open")) return;
    const r = route();
    if (r.view === "tavoli") viewTavoli();
    if (r.view === "tavolo") { const t = tavoloById(r.id); const el = $("#tSince"); if (t && el) el.textContent = tempo(t.creato); }
  }, 30000);

  /* ---------- Pulsante «Aggiorna»: controlla subito app e menu ---------- */
  let aggiornandoApp = false, controlloInCorso = false;
  function messaggio(titolo, testo) {
    apriFinestra(`
      <div class="dlg">
        <h3>${esc(titolo)}</h3>
        <p>${testo}</p>
        <div class="dlg-actions"><button class="btn primary" data-action="chiudi-finestra">OK</button></div>
      </div>`, true);
  }
  async function nuovaVersioneApp() {
    // se l'app non era ancora installata non c'è niente da aggiornare (si sta solo salvando per l'offline)
    if (!("serviceWorker" in navigator) || !navigator.serviceWorker.controller) return false;
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return false;
    await reg.update();
    const sw = reg.installing || reg.waiting;
    if (!sw) return false;
    // aspetta che la nuova versione sia pronta (al massimo 20 secondi)
    await new Promise((ok) => {
      if (sw.state === "activated") return ok();
      const t = setTimeout(ok, 20000);
      sw.addEventListener("statechange", () => { if (sw.state === "activated") { clearTimeout(t); ok(); } });
    });
    return true;
  }
  async function controllaAggiornamenti() {
    if (controlloInCorso) return;
    controlloInCorso = true;
    const btns = document.querySelectorAll(".agg-btn");
    btns.forEach((b) => b.classList.add("gira"));
    const fine = () => { controlloInCorso = false; btns.forEach((b) => b.classList.remove("gira")); };
    const offline = () => { fine(); messaggio("Nessuna connessione", "Serve internet per controllare se c'è una nuova versione dell'app. Riprova quando sei collegato."); };
    if (APP) {
      const a = await controllaApk();
      fine();
      if (a === "offline") return offline();
      if (a) return messaggio("Nuova versione dell'app", `È disponibile la versione <b>${esc(a.versione)}</b>.
        Tocca <b>Scarica</b> nell'avviso in alto, poi apri il file scaricato e conferma <b>Aggiorna</b>.
        Tavoli, menu e cronologia restano salvati.`);
      return messaggio("App già aggiornata", `Hai già l'ultima versione dell'app (${esc(APP.versione())}).`);
    }
    if (!navigator.onLine) return offline();
    let appNuova = false;
    try { aggiornandoApp = true; appNuova = await nuovaVersioneApp(); } catch {}
    if (appNuova) { toast("Aggiorno l'app…"); setTimeout(() => location.reload(), 600); return; }
    aggiornandoApp = false;
    fine();
    messaggio("App già aggiornata", "Hai già l'ultima versione dell'app.");
  }

  /* ---------- App Android: c'è un APK nuovo? (android/versione.json sul sito) ---------- */
  let apkNuovo = null, ultimoControlloApk = 0;
  async function controllaApk() {
    if (!APP) return null;
    ultimoControlloApk = Date.now();
    try {
      const r = await fetch(`${D.online}android/versione.json?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) return null;
      const v = await r.json();
      if (!(v.codice > APP.codice())) return null;
      apkNuovo = { versione: v.versione, url: D.online + (v.apk || "Dejavu-Staff.apk") };
      mostraAvviso("apk");
      return apkNuovo;
    } catch { return "offline"; }
  }

  // Avvio: si usa il menu salvato sul dispositivo; la prima volta quello originale
  async function avvio() {
    if (!MENU) $("#app").innerHTML = `<div class="empty"><div class="big">🍸</div>Carico il menu…</div>`;
    let originale = null;
    try { originale = await menuOriginale(); } catch {}
    if (!MENU) MENU = originale;
    if (!MENU) {
      $("#app").innerHTML = `<div class="empty"><div class="big">⚠️</div>Non riesco a caricare il menu:<br>chiudi e riapri l'app.</div>`;
      return;
    }
    // «I nostri Prodotti» non si modificano dall'app: sempre quelli dell'app installata (shared/menu.json),
    // così con un aggiornamento dell'app arrivano le bottiglie nuove anche se il menu è stato modificato
    if (originale && originale.prodotti) MENU.prodotti = originale.prodotti;
    paneIniziale();
    render();
  }
  avvio();
  if (APP) controllaApk();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (APP && Date.now() - ultimoControlloApk > 30 * 60 * 1000) controllaApk();
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration)
      navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
  });

  // Tasto «indietro» di Android: chiude la finestra aperta o torna alla pagina precedente.
  // Restituisce false sulla pagina iniziale (l'app allora va in secondo piano).
  window.dejavuIndietro = () => {
    if ($("#overlay").classList.contains("open")) { if (!finestraBloccata) chiudiFinestra(null); return true; }
    const r = route();
    if (r.view === "tavolo" && ui.pagamento) { ui.pagamento = null; render(); return true; }
    if (r.view === "home") return false;
    location.hash = r.view === "tavolo" ? "#tavoli" : "#home";
    return true;
  };

  if ("serviceWorker" in navigator && !APP) {
    const avevaSw = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (aggiornandoApp) return location.reload();
      if (avevaSw) mostraAvviso("app");
    });
    navigator.serviceWorker.register("sw.js").then((r) => r.update()).catch(() => {});
  }
})();
</script>
</body>
</html>
