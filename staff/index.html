  function listaMenu() {
    $("#meChips").innerHTML = chipsHtml(MENU.drinks, ui.meQ.trim() ? "" : ui.meCat, "me-cat");
    const items = filtra(MENU.drinks, ui.meQ, ui.meCat);
    $("#meLista").innerHTML = items.length
      ? items.map((d) => {
          const info = [catNome(d.categoria)];
          if (d.varianti && d.varianti.length) info.push(`${d.varianti.length} varianti`);
          if (haRicetta(d)) info.push("ricetta");
          return `<button class="mrow" data-action="me-modifica" data-id="${esc(d.id)}">
            ${tileHtml(d)}
            <div><div class="n">${esc(d.nome)}</div><div class="s">${esc(info.join(" · "))}</div></div>
            <span class="p">${prezzoLabel(d)}</span>
          </button>`;
        }).join("")
      : `<div class="empty">Nessuna voce trovata.</div>`;
  }

  const numero = (v) => { const n = parseFloat(String(v).replace(",", ".").trim()); return isFinite(n) ? n : NaN; };
  const prezzoTxt = (p) => (p == null ? "" : String(p).replace(".", ","));
  function slug(nome) {
    const base = norm(nome).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "voce";
    let id = base, i = 2;
    while (MENU.drinks.some((d) => d.id === id) || MENU.categorie.some((c) => c.id === id)) id = `${base}-${i++}`;
    return id;
  }
  function rigaEditor(tipo, v = {}) {
    const x = `<button type="button" class="x" data-action="me-del-row" aria-label="Togli">✕</button>`;
    if (tipo === "var") return `<div class="erow">
        <input data-f="nome" placeholder="Nome (es. Aperol)" value="${esc(v.nome || "")}">
        <input data-f="prezzo" placeholder="Prezzo" inputmode="decimal" value="${esc(prezzoTxt(v.prezzo))}">
        <input data-f="info" placeholder="Descrizione breve (facoltativa)" value="${esc(v.info || "")}">${x}</div>`;
    if (tipo === "ingr") return `<div class="erow">
        <input data-f="nome" placeholder="Ingrediente (es. Gin)" value="${esc(v.nome || "")}">
        <input data-f="dose" placeholder="Dose (es. 30 ml)" value="${esc(v.dose || "")}">${x}</div>`;
    return `<div class="erow"><textarea data-f="testo" rows="2" placeholder="Descrivi il passaggio">${esc(v.testo || "")}</textarea>${x}</div>`;
  }

  function apriEditor(id) {
    const d = id ? MENU.drinks.find((x) => x.id === id) : null;
    const v = d || { categoria: ui.meCat !== "tutti" ? ui.meCat : (MENU.categorie[0] || {}).id, emoji: "🍸" };
    const varianti = (v.varianti || []).map((x) => (typeof x === "string" ? { nome: x } : x));
    const campo = (name, label, ph = "") =>
      `<label>${label}<input name="${name}" value="${esc(v[name] || "")}" placeholder="${esc(ph)}"></label>`;
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <form class="dlg editor" id="meForm" autocomplete="off" data-id="${esc(d ? d.id : "")}">
        <h3>${d ? "Modifica voce" : "Nuova voce"}</h3>
        <div class="egrid">
          <label style="grid-column: span 2">Nome<input name="nome" value="${esc(v.nome || "")}" placeholder="es. Negroni"></label>
          <label>Prezzo (€)<input name="prezzo" inputmode="decimal" value="${esc(prezzoTxt(v.prezzo))}" placeholder="es. 10"></label>
          <label>Categoria<select name="categoria">${MENU.categorie.map((c) =>
            `<option value="${esc(c.id)}" ${c.id === v.categoria ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select></label>
          <label>Icona<input name="emoji" value="${esc(v.emoji || "")}" placeholder="🍸" maxlength="8"></label>
        </div>
        <label>Descrizione<textarea name="descrizione" rows="2" placeholder="Facoltativa">${esc(v.descrizione || "")}</textarea></label>

        <h4>Varianti</h4>
        <p class="hint">Le scelte che compaiono quando aggiungi la voce a un tavolo (gusti, gin, piccola/media, calice/bottiglia…).
          Prezzo vuoto = prezzo della voce.</p>
        <div id="eVar">${varianti.map((x) => rigaEditor("var", x)).join("")}</div>
        <button type="button" class="btn small add" data-action="me-add-row" data-tipo="var" data-into="eVar">+ Aggiungi variante</button>

        <h4>Ricetta</h4>
        <p class="hint">La voce compare nella sezione Ricette se ha almeno un ingrediente.</p>
        <div class="egrid">
          ${campo("bicchiere", "Bicchiere", "es. Old fashioned")}
          ${campo("ghiaccio", "Ghiaccio", "es. Cubo grande")}
          ${campo("metodo", "Metodo", "es. Stir, Shake, Build")}
          ${campo("guarnizione", "Guarnizione", "es. Scorza d'arancia")}
        </div>
        <label style="margin-top:20px">Ingredienti e dosi</label>
        <div id="eIngr">${(v.ingredienti || []).map((x) => rigaEditor("ingr", x)).join("")}</div>
        <button type="button" class="btn small add" data-action="me-add-row" data-tipo="ingr" data-into="eIngr">+ Aggiungi ingrediente</button>
        <label style="margin-top:20px">Passaggi</label>
        <div id="ePass">${(v.passaggi || []).map((t) => rigaEditor("pass", { testo: t })).join("")}</div>
        <button type="button" class="btn small add" data-action="me-add-row" data-tipo="pass" data-into="ePass">+ Aggiungi passaggio</button>
        <label>Note per lo staff<textarea name="note" rows="2" placeholder="Facoltative">${esc(v.note || "")}</textarea></label>

        <div class="err" id="meErr"></div>
        <div class="dlg-actions">
          ${d ? `<button type="button" class="btn danger" data-action="me-elimina">Elimina voce</button><span class="spacer"></span>` : ""}
          <button type="button" class="btn" data-action="chiudi-finestra">Annulla</button>
          <button type="submit" class="btn primary">Salva</button>
        </div>
      </form>`);
    $("#box").classList.add("wide");
    finestraBloccata = true;
    $("#meForm").addEventListener("submit", (e) => { e.preventDefault(); salvaVoce(); });
    if (!d) $("#meForm [name=nome]").focus();
  }

  async function salvaVoce() {
    const f = $("#meForm");
    const val = (n) => f.elements[n].value.trim();
    const errore = (m) => { $("#meErr").textContent = m; $("#meErr").scrollIntoView({ block: "nearest" }); };
    const nome = val("nome");
    if (!nome) return errore("Scrivi il nome.");
    const prezzo = numero(val("prezzo"));
    if (!(prezzo >= 0)) return errore("Prezzo non valido (es. 10 oppure 6,50).");

    const righe = (id) => [...f.querySelectorAll(`#${id} .erow`)].map((r) =>
      Object.fromEntries([...r.querySelectorAll("[data-f]")].map((el) => [el.dataset.f, el.value.trim()])));
    const varianti = [];
    for (const r of righe("eVar")) {
      if (!r.nome) continue;
      const o = { nome: r.nome };
      if (r.prezzo) {
        const vp = numero(r.prezzo);
        if (!(vp >= 0)) return errore(`Prezzo non valido nella variante «${r.nome}».`);
        if (vp !== prezzo) o.prezzo = vp;
      }
      if (r.info) o.info = r.info;
      varianti.push(Object.keys(o).length === 1 ? o.nome : o);
    }
    const ingredienti = righe("eIngr").filter((r) => r.nome).map((r) => ({ nome: r.nome, dose: r.dose || "" }));
    const passaggi = righe("ePass").map((r) => r.testo).filter(Boolean);

    const id = f.dataset.id;
    const vecchia = id ? MENU.drinks.find((x) => x.id === id) : null;
    const voce = vecchia ? { ...vecchia } : { id: slug(nome) };
    Object.assign(voce, { nome, categoria: val("categoria"), prezzo, emoji: val("emoji") || "🍸" });
    const opzionali = { descrizione: val("descrizione"), bicchiere: val("bicchiere"), ghiaccio: val("ghiaccio"),
      metodo: val("metodo"), guarnizione: val("guarnizione"), note: val("note") };
    for (const [k, v] of Object.entries(opzionali)) { if (v) voce[k] = v; else delete voce[k]; }
    for (const [k, v] of Object.entries({ varianti, ingredienti, passaggi })) { if (v.length) voce[k] = v; else delete voce[k]; }

    const lista = MENU.drinks.filter((x) => x.id !== voce.id);
    let pos = vecchia && vecchia.categoria === voce.categoria ? MENU.drinks.indexOf(vecchia) : -1;
    if (pos < 0) {
      const ultimo = lista.map((x) => x.categoria).lastIndexOf(voce.categoria);
      pos = ultimo >= 0 ? ultimo + 1 : lista.length;
    }
    lista.splice(pos, 0, voce);
    const nuovo = clona(MENU);
    nuovo.drinks = lista;
    const btn = f.querySelector("[type=submit]");
    btn.disabled = true; btn.textContent = "Pubblico…";
    try {
      await pubblicaMenu(nuovo, `Menu: ${vecchia ? "modificato" : "aggiunto"} «${nome}»`);
    } catch (err) {
      btn.disabled = false; btn.textContent = "Salva";
      return errore(err.message);
    }
    chiudiFinestra(null);
    toast(vecchia ? `Salvato «${nome}» per tutti` : `Aggiunto «${nome}» per tutti`);
    if (route().view === "menu") viewMenu();
  }

  function apriCategorie() {
    const riga = (c) => {
      const n = MENU.drinks.filter((d) => d.categoria === c.id).length;
      return `<div class="erow" data-id="${esc(c.id || "")}">
        <button type="button" class="mv" data-action="me-cat-su" aria-label="Su">↑</button>
        <input data-f="nome" value="${esc(c.nome || "")}" placeholder="Nome categoria">
        <span class="cnt">${c.id ? `${n} voci` : "nuova"}</span>
        <button type="button" class="x" data-action="me-cat-del" ${n ? "disabled title='Contiene voci'" : ""} aria-label="Elimina">✕</button>
      </div>`;
    };
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <form class="dlg editor" id="catForm" autocomplete="off">
        <h3>Categorie</h3>
        <p class="hint">Rinomina, riordina con ↑ o aggiungi categorie. Si può eliminare solo una categoria vuota.</p>
        <div id="eCat">${MENU.categorie.map(riga).join("")}</div>
        <button type="button" class="btn small add" data-action="me-cat-add">+ Nuova categoria</button>
        <div class="err" id="catErr"></div>
        <div class="dlg-actions">
          <button type="button" class="btn" data-action="chiudi-finestra">Annulla</button>
          <button type="submit" class="btn primary">Salva</button>
        </div>
      </form>`);
    finestraBloccata = true;
    apriCategorie.riga = riga;
    $("#catForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nuove = [];
      for (const r of document.querySelectorAll("#eCat .erow")) {
        const nome = r.querySelector("[data-f=nome]").value.trim();
        if (!nome) { $("#catErr").textContent = "Ogni categoria deve avere un nome."; return; }
        if (nuove.some((c) => norm(c.nome) === norm(nome))) { $("#catErr").textContent = `La categoria «${nome}» è ripetuta.`; return; }
        nuove.push({ id: r.dataset.id || slug(nome), nome });
      }
      const nuovo = clona(MENU);
      nuovo.categorie = nuove;
      const btn = $("#catForm [type=submit]");
      btn.disabled = true; btn.textContent = "Pubblico…";
      try { await pubblicaMenu(nuovo, "Menu: categorie aggiornate"); }
      catch (err) { btn.disabled = false; btn.textContent = "Salva"; $("#catErr").textContent = err.message; return; }
      chiudiFinestra(null);
      toast("Categorie salvate per tutti");
      if (route().view === "menu") viewMenu();
    });
  }

  async function esportaMenu() {
    const dati = { app: "dejavu-staff", tipo: "menu", esportato: new Date().toISOString(), categorie: MENU.categorie, drinks: MENU.drinks };
    const nome = `menu-dejavu-${new Date().toISOString().slice(0, 10)}.json`;
    const blob = new Blob([JSON.stringify(dati, null, 2)], { type: "application/json" });
    try {
      const file = new File([blob], nome, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Menu Déjà Vu" }); return; }
    } catch (err) { if (err && err.name === "AbortError") return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  function apriImpostazioni() {
    const t = leggiToken();
    apriFinestra(`
      <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      <form class="dlg editor" id="keyForm" autocomplete="off">
        <h3>Chiave di pubblicazione</h3>
        <p>Serve per salvare le modifiche al menu e mandarle a tutti i dispositivi.
          Inseriscila solo sui dispositivi del proprietario o del responsabile.</p>
        <p>Stato: ${t ? `<b class="stato-ok">chiave inserita ✓</b>` : "<b>nessuna chiave</b>"}</p>
        <label>Chiave GitHub (inizia con github_pat_)<input name="token" type="password" placeholder="${t ? "•••••• (lascia vuoto per non cambiarla)" : "github_pat_…"}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <p class="hint">Come crearla: su github.com, account <b>${esc(GH.owner)}</b> → Settings → Developer settings →
          Personal access tokens → Fine-grained tokens → Generate new token. Repository: solo <b>${esc(GH.repo)}</b>.
          Permessi: <b>Contents → Read and write</b>. Le istruzioni passo passo sono nel README.</p>
        <div class="err" id="keyErr"></div>
        <div class="dlg-actions">
          ${t ? `<button type="button" class="btn danger" data-action="me-chiave-rimuovi">Rimuovi chiave</button><span class="spacer"></span>` : ""}
          <button type="button" class="btn" data-action="chiudi-finestra">Annulla</button>
          <button type="submit" class="btn primary">Verifica e salva</button>
        </div>
      </form>`);
    finestraBloccata = true;
    $("#keyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nuovo = e.target.elements.token.value.trim();
      if (!nuovo) return chiudiFinestra(null);
      const btn = e.target.querySelector("[type=submit]");
      btn.disabled = true; btn.textContent = "Verifico…";
      let ok = false, msg = "";
      try {
        const r = await ghApi(`contents/${GH.menuPath}?ref=${GH.branch}`, {}, nuovo);
        const repo = r.ok ? await (await ghApi("", {}, nuovo)).json() : null;
        ok = r.ok && repo && repo.permissions && repo.permissions.push;
        if (r.status === 401) msg = "Chiave non valida o scaduta.";
        else if (!r.ok) msg = `La chiave non può leggere il repository ${GH.repo} (errore ${r.status}).`;
        else if (!ok) msg = "La chiave può leggere ma non modificare: serve il permesso Contents → Read and write.";
      } catch { msg = "Serve la connessione a internet per verificare la chiave."; }
      if (!ok) { btn.disabled = false; btn.textContent = "Verifica e salva"; $("#keyErr").textContent = msg; return; }
      try { localStorage.setItem(TOKEN_KEY, nuovo); } catch {}
      chiudiFinestra(null);
      toast("Chiave salvata: ora puoi modificare il menu");
      if (route().view === "menu") viewMenu();
    });
  }

  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-action^='me-']");
    if (!b) return;
    switch (b.dataset.action) {
      case "me-cat": ui.meCat = b.dataset.cat; ui.meQ = ""; $("#meQ").value = ""; return listaMenu();
      case "me-nuova": return apriEditor(null);
      case "me-modifica": return apriEditor(b.dataset.id);
      case "me-add-row": {
        const box = document.getElementById(b.dataset.into);
        box.insertAdjacentHTML("beforeend", rigaEditor(b.dataset.tipo));
        const nuova = box.lastElementChild.querySelector("input, textarea");
        if (nuova) nuova.focus();
        return;
      }
      case "me-del-row": return b.closest(".erow").remove();
      case "me-elimina": {
        if (!b.classList.contains("fill")) { b.classList.add("fill"); b.textContent = "Tocca ancora per eliminare"; return; }
        const id = $("#meForm").dataset.id;
        const voce = MENU.drinks.find((x) => x.id === id);
        const nuovo = clona(MENU);
        nuovo.drinks = nuovo.drinks.filter((x) => x.id !== id);
        b.disabled = true; b.textContent = "Pubblico…";
        try { await pubblicaMenu(nuovo, `Menu: eliminato «${voce ? voce.nome : id}»`); }
        catch (err) { b.disabled = false; b.textContent = "Elimina voce"; b.classList.remove("fill"); $("#meErr").textContent = err.message; return; }
        chiudiFinestra(null);
        toast(`Eliminato «${voce ? voce.nome : ""}» per tutti`);
        return viewMenu();
      }
      case "me-categorie": return apriCategorie();
      case "me-cat-add": {
        $("#eCat").insertAdjacentHTML("beforeend", apriCategorie.riga({ nome: "" }));
        return $("#eCat").lastElementChild.querySelector("input").focus();
      }
      case "me-cat-su": {
        const r = b.closest(".erow");
        if (r.previousElementSibling) r.parentNode.insertBefore(r, r.previousElementSibling);
        return;
      }
      case "me-cat-del": return b.closest(".erow").remove();
      case "me-esporta": return esportaMenu();
      case "me-impostazioni": return apriImpostazioni();
      case "me-chiave-rimuovi": {
        try { localStorage.removeItem(TOKEN_KEY); } catch {}
        chiudiFinestra(null);
        toast("Chiave rimossa da questo dispositivo");
        if (route().view === "menu") viewMenu();
        return;
      }
    }
  });

  /* ---------- Azioni ---------- */
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-action]");
    if (!b) return;
    const a = b.dataset.action;
    const r = route();
    const t = r.view === "tavolo" ? tavoloById(r.id) : null;
    const riga = t && b.dataset.riga ? t.righe.find((x) => x.id === b.dataset.riga) : null;
    const pay = ui.pagamento && t && ui.pagamento.id === t.id ? ui.pagamento.sel : null;

    switch (a) {
      case "chiudi-finestra": return chiudiFinestra(null);
      case "finestra-ok": return chiudiFinestra(true);
      case "ric-cat": ui.ricCat = b.dataset.cat; ui.ricQ = ""; $("#ricQ").value = ""; return listaRicette();
      case "apri-ricetta": return apriRicetta(b.dataset.id);
      case "slide": mostraSlide(+b.dataset.i); return avviaSlide();
      case "aggiorna": return controllaAggiornamenti();
      case "scendi": return window.scrollTo({ top: $(".hero").offsetHeight, behavior: "smooth" });
      case "nuovo-tavolo": return nuovoTavolo();
      case "apri-tavolo": location.hash = "#tavolo/" + encodeURIComponent(b.dataset.id); return;
    }
    if (!t) return;

    switch (a) {
      case "pick-cat":
        ui.pickCat = b.dataset.cat; ui.pickQ = ""; $("#pickQ").value = "";
        return listaPicker(t);

      case "aggiungi": {
        const d = drinkById(b.dataset.id);
        if (!d) return;
        if (d.varianti && d.varianti.length) return sceltaVariante(d);
        aggiungiRiga(t, { drinkId: d.id, nome: d.nome, prezzoCent: cent(d.prezzo) });
        const nb = document.querySelector(`.pbtn[data-id="${CSS.escape(d.id)}"]`);
        if (nb) { nb.classList.add("flash"); setTimeout(() => nb.classList.remove("flash"), 250); }
        return;
      }

      case "aggiungi-var": {
        const d = drinkById(b.dataset.id);
        const v = d && d.varianti[+b.dataset.i];
        if (!v) return;
        const nome = `${d.nome} · ${varNome(v)}`;
        chiudiFinestra(null);
        aggiungiRiga(t, { drinkId: d.id, nome, prezzoCent: cent(varPrezzo(d, v)) });
        toast(`+ ${nome}`);
        return;
      }

      case "voce-libera": {
        const v = await chiedi({
          titolo: "Voce libera",
          campi: [
            { name: "nome", label: "Descrizione", placeholder: "es. Patatine, Shot, Acqua…" },
            { name: "prezzo", label: "Prezzo (€)", placeholder: "es. 3,50", inputmode: "decimal" },
          ],
          ok: "Aggiungi",
          valida: (v) => {
            if (!v.nome.trim()) return "Scrivi una descrizione.";
            const p = parseFloat(v.prezzo.replace(",", "."));
            if (!(p >= 0)) return "Prezzo non valido.";
          },
        });
        if (!v) return;
        return aggiungiRiga(t, { nome: v.nome.trim(), prezzoCent: Math.round(parseFloat(v.prezzo.replace(",", ".")) * 100) });
      }

      case "inc": if (riga) { riga.qty++; salva(); aggiornaTavolo(t); } return;
      case "dec":
        if (!riga) return;
        riga.qty--;
        if (riga.qty <= 0) t.righe = t.righe.filter((x) => x !== riga);
        salva(); aggiornaTavolo(t);
        return;

      case "rinomina": {
        const v = await chiedi({
          titolo: "Rinomina tavolo",
          campi: [{ name: "nome", label: "Nome del tavolo", value: t.nome }],
          ok: "Salva",
          valida: (v) => validaNome(v.nome, t.id),
        });
        if (!v) return;
        t.nome = v.nome.trim(); salva();
        $("#tNome").textContent = t.nome;
        return;
      }

      case "pane":
        ui.pane = b.dataset.pane; aggiornaTavolo(t); window.scrollTo(0, 0);
        return;

      case "paga-separato": ui.pagamento = { id: t.id, sel: {} }; return aggiornaTavolo(t);
      case "pay-annulla": ui.pagamento = null; return aggiornaTavolo(t);
      case "pay-inc": if (pay && riga) { pay[riga.id] = Math.min(riga.qty, (pay[riga.id] || 0) + 1); aggiornaTavolo(t); } return;
      case "pay-dec": if (pay && riga) { pay[riga.id] = Math.max(0, (pay[riga.id] || 0) - 1); aggiornaTavolo(t); } return;
      case "pay-riga": if (pay && riga) { pay[riga.id] = pay[riga.id] === riga.qty ? 0 : riga.qty; aggiornaTavolo(t); } return;
      case "pay-tutto": if (pay) { t.righe.forEach((x) => (pay[x.id] = x.qty)); aggiornaTavolo(t); } return;

      case "pay-conferma": {
        if (!pay) return;
        const incassato = t.righe.reduce((s, x) => s + (pay[x.id] || 0) * x.prezzoCent, 0);
        t.righe.forEach((x) => (x.qty -= pay[x.id] || 0));
        t.righe = t.righe.filter((x) => x.qty > 0);
        ui.pagamento = null;
        salva(); aggiornaTavolo(t);
        toast(`Incassati ${euro(incassato)}`);
        if (!t.righe.length) {
          const ok = await conferma({ titolo: "Tavolo saldato", testo: `<b>${esc(t.nome)}</b> ha pagato tutto. Vuoi chiudere il tavolo?`, ok: "Chiudi tavolo" });
          if (ok) eliminaTavolo(t);
        }
        return;
      }

      case "chiudi-tavolo": {
        const tot = totale(t);
        const ok = await conferma({
          titolo: `Chiudere «${t.nome}»?`,
          testo: tot
            ? `Il tavolo verrà eliminato con tutti gli ordini.<br>Totale da incassare: <b style="color:var(--text)">${euro(tot)}</b>`
            : "Il tavolo verrà eliminato.",
          ok: tot ? `Pagato ${euro(tot)} · Chiudi` : "Chiudi tavolo",
          pericolo: true,
        });
        if (ok) eliminaTavolo(t);
        return;
      }
    }
  });

  function eliminaTavolo(t) {
    tavoli = tavoli.filter((x) => x.id !== t.id);
    salva();
    toast(`Tavolo «${t.nome}» chiuso`);
    location.hash = "#tavoli";
  }

  // Aggiorna i tempi "aperto da…" ogni 30 secondi
  setInterval(() => {
    if ($("#overlay").classList.contains("open")) return;
    const r = route();
    if (r.view === "tavoli") viewTavoli();
    if (r.view === "tavolo") { const t = tavoloById(r.id); const el = $("#tSince"); if (t && el) el.textContent = tempo(t.creato); }
  }, 30000);

  /* ---------- Pulsante «Aggiorna»: controlla subito app e menu ---------- */
  let aggiornandoApp = false, controlloInCorso = false;
  function messaggio(titolo, testo) {
    apriFinestra(`
      <div class="dlg">
        <h3>${esc(titolo)}</h3>
        <p>${testo}</p>
        <div class="dlg-actions"><button class="btn primary" data-action="chiudi-finestra">OK</button></div>
      </div>`, true);
  }
  async function nuovaVersioneApp() {
    // se l'app non era ancora installata non c'è niente da aggiornare (si sta solo salvando per l'offline)
    if (!("serviceWorker" in navigator) || !navigator.serviceWorker.controller) return false;
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return false;
    await reg.update();
    const sw = reg.installing || reg.waiting;
    if (!sw) return false;
    // aspetta che la nuova versione sia pronta (al massimo 20 secondi)
    await new Promise((ok) => {
      if (sw.state === "activated") return ok();
      const t = setTimeout(ok, 20000);
      sw.addEventListener("statechange", () => { if (sw.state === "activated") { clearTimeout(t); ok(); } });
    });
    return true;
  }
  async function controllaAggiornamenti() {
    if (controlloInCorso) return;
    controlloInCorso = true;
    const btns = document.querySelectorAll(".agg-btn");
    btns.forEach((b) => b.classList.add("gira"));
    const fine = () => { controlloInCorso = false; btns.forEach((b) => b.classList.remove("gira")); };
    let online = true, menuCambiato = false;
    try {
      const m = await scaricaMenu();
      if (!MENU || (m.versione || "") > (MENU.versione || "")) { applicaMenu(m); menuCambiato = true; }
    } catch { online = false; }
    if (!online) { fine(); return messaggio("Nessuna connessione", "Serve internet per controllare gli aggiornamenti. Riprova quando sei collegato."); }
    let appNuova = false;
    try { aggiornandoApp = true; appNuova = await nuovaVersioneApp(); } catch {}
    if (appNuova) { toast("Aggiorno l'app…"); setTimeout(() => location.reload(), 600); return; }
    aggiornandoApp = false;
    fine();
    if (menuCambiato) return messaggio("Menu aggiornato", "Ho caricato l'ultima versione del menu.");
    const quando = MENU && MENU.versione && MENU.versione > "2026-10-16"
      ? ` Menu aggiornato il ${esc(new Date(MENU.versione).toLocaleString("it-IT", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }))}.`
      : "";
    messaggio("App già aggiornata", `Hai già l'ultima versione dell'app e del menu.${quando}`);
  }

  // Avvio: si usa subito la copia del menu salvata sul dispositivo, poi si controlla se online ce n'è una nuova
  async function avvio() {
    if (!MENU) {
      $("#app").innerHTML = `<div class="empty"><div class="big">🍸</div>Carico il menu…</div>`;
      await controllaMenu();
      if (!MENU) {
        $("#app").innerHTML = `<div class="empty"><div class="big">📶</div>Per il primo avvio serve internet:<br>collegati e riapri l'app.</div>`;
        return;
      }
    } else {
      controllaMenu();
    }
    paneIniziale();
    render();
  }
  avvio();
  setInterval(controllaMenu, 2 * 60 * 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    controllaMenu();
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration)
      navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
  });

  if ("serviceWorker" in navigator) {
    const avevaSw = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (aggiornandoApp) return location.reload();
      if (avevaSw) mostraAvviso("app");
    });
    navigator.serviceWorker.register("sw.js").then((r) => r.update()).catch(() => {});
  }
})();
</script>
</body>
