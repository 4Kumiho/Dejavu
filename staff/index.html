<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Déjà Vu · Staff</title>
<meta name="theme-color" content="#0b2428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Déjà Vu Staff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="../shared/brand.css">
<style>
  :root {
    --bg: var(--dv-deep);
    --panel: rgba(6, 27, 32, .72);
    --panel-2: rgba(28, 76, 86, .45);
    --line: rgba(81, 199, 227, .22);
    --text: var(--dv-text);
    --muted: var(--dv-muted);
    --accent: var(--dv-tq);
    --ok: #22c55e;
    --danger: #ef4444;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--text); }
  body {
    font-family: var(--dv-font);
    font-size: 16px; min-height: 100vh;
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  ::placeholder { color: var(--muted); opacity: .8; }
  input { font: inherit; }

  /* Testata */
  .top {
    position: sticky; top: 0; z-index: 10; background: rgba(6,27,32,.9);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display: flex; align-items: center; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .brand img { width: 46px; height: 46px; }
  .tabs { margin-left: auto; display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .tabs a {
    text-decoration: none; color: var(--muted); padding: 9px 20px; border-radius: 9px; font-weight: 600;
  }
  .tabs a.on { background: var(--accent); color: var(--dv-ink); }

  main { max-width: 1280px; margin: 0 auto; padding: 16px; }

  /* Elementi comuni */
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px;
    padding: 12px 18px; font-weight: 600; min-height: 48px;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--dv-ink); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #052e16; }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.danger.fill { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .4; pointer-events: none; }
  .search {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); outline: none; font-size: 17px;
  }
  .search:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 9px 16px; border-radius: 999px; font-weight: 500;
  }
  .chip.on { background: var(--accent); color: var(--dv-ink); border-color: var(--accent); }
  .tile {
    width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; flex: none; margin: 6px;
  }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty .big { font-size: 48px; margin-bottom: 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  /* Ricette */
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .rcard {
    display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .rcard .n { font-weight: 600; font-size: 17px; }
  .rcard .s { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .ric-head { position: relative; padding: 34px 0 6px; display: flex; justify-content: center; }
  .ric-head .dv-ring { width: 130px; height: 130px; display: grid; place-items: center; font-size: 60px; }
  .ric-body { padding: 20px 22px 26px; }
  .ric-body h3 { flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  .ric-body h3 { margin: 0; font-size: 28px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .ric-body h3 .p { color: var(--accent); font-size: 20px; }
  .ric-body h4 { text-transform: uppercase; letter-spacing: .18em; font-size: 12px; color: var(--accent); margin: 24px 0 10px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 16px; }
  .meta div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; }
  .meta b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  .ingr { width: 100%; border-collapse: collapse; }
  .ingr td { padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 17px; text-align: left; }
  .ingr td:last-child { text-align: right; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; display: flex; gap: 12px; padding: 8px 0; line-height: 1.45; font-size: 17px; }
  .steps li::before {
    content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--dv-ink);
    display: grid; place-items: center; font-weight: 700; font-size: 14px;
  }
  .nota { margin-top: 18px; background: var(--dv-tq-soft); border: 1px solid var(--dv-tq-line); border-radius: 12px; padding: 12px 14px; line-height: 1.45; }

  /* Lista tavoli */
  .bar-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .bar-row h2 { margin: 0; font-size: 24px; }
  .bar-row .sub { color: var(--muted); }
  .bar-row .btn { margin-left: auto; }
  @media (max-width: 560px) { .bar-row .btn { width: 100%; } .bar-row .sub { font-size: 14px; } }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .tcard {
    text-align: left; padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    display: flex; flex-direction: column; gap: 6px; min-height: 130px;
  }
  .tcard:active { transform: scale(.98); }
  .tcard .n { font-size: 20px; font-weight: 700; word-break: break-word; }
  .tcard .i { color: var(--muted); font-size: 14px; }
  .tcard .t { margin-top: auto; font-size: 24px; font-weight: 700; color: var(--accent); }

  /* Dettaglio tavolo */
  .thead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .thead h2 { margin: 0; font-size: 26px; word-break: break-word; }
  .thead .since { color: var(--muted); font-size: 14px; width: 100%; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); flex: none; }
  .tlayout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  .mtabs { display: none; }
  @media (max-width: 899px) {
    .mtabs {
      display: flex; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top) + 67px); z-index: 5;
      margin: 0 -16px 12px; padding: 8px 16px; background: rgba(6,27,32,.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    }
    .mtabs button {
      flex: 1; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: transparent;
      color: var(--muted); font-weight: 700;
    }
    .mtabs button.on { background: var(--accent); border-color: var(--accent); color: var(--dv-ink); }
    .tlayout[data-pane="ordine"] #picker, .tlayout[data-pane="aggiungi"] #ordine { display: none; }
  }
  @media (min-width: 900px) {
    .tlayout { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
    .ordine { position: sticky; top: 84px; }
  }
  .ordine { padding: 6px 0 0; }
  .righe { max-height: calc(100vh - 330px); overflow-y: auto; }
  @media (max-width: 899px) { .righe { max-height: none; } }
  .riga { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .riga .info { flex: 1; min-width: 0; }
  .riga .nome { font-weight: 600; font-size: 17px; background: none; border: none; padding: 0; text-align: left; }
  .riga .nome.link { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .riga .cad { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .riga .tot { width: 84px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .step { display: flex; align-items: center; background: var(--panel-2); border-radius: 12px; border: 1px solid var(--line); }
  .step button { width: 44px; height: 44px; border: none; background: none; font-size: 22px; }
  .step span { min-width: 44px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .step.pay { border-color: var(--ok); }
  .step.pay span { color: var(--ok); }
  .mini { border: 1px solid var(--line); background: none; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--muted); }
  .totale { display: flex; justify-content: space-between; align-items: baseline; padding: 16px; font-size: 20px; font-weight: 700; }
  .totale .v { font-size: 30px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .totale.pay .v { color: var(--ok); }
  .azioni { display: flex; gap: 10px; padding: 0 16px 16px; flex-wrap: wrap; }
  .azioni .btn { flex: 1; min-width: 140px; }
  .paga-banner { margin: 0 16px 12px; padding: 10px 14px; border-radius: 12px; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.4); font-size: 14px; }

  .picker { padding: 14px; }
  .picker.off { opacity: .35; pointer-events: none; }
  .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  @media (max-width: 560px) {
    main { padding: 12px; }
    .mtabs { margin: 0 -12px 12px; padding: 8px 12px; }
    .picker { padding: 10px; }
    .plist { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pbtn { gap: 6px; padding: 8px 6px; }
    .pbtn .tile { width: 32px; height: 32px; font-size: 16px; margin: 4px; }
    .pbtn .n { font-size: 14px; }
    .riga { gap: 8px; padding: 10px 12px; }
    .riga .nome { font-size: 16px; }
    .riga .tot { width: 62px; font-size: 14px; }
    .step button { width: 38px; height: 42px; }
    .step span { min-width: 36px; }
    .riga .mini { display: none; }
    .totale { padding: 14px 12px; }
    .totale .v { font-size: 26px; }
    .azioni { padding: 0 12px 12px; }
    .azioni .btn { min-width: 0; }
    .thead h2 { font-size: 22px; }
    .top { gap: 10px; padding-left: 12px; padding-right: 12px; }
    .tabs a { padding: 9px 14px; }
    .rgrid { grid-template-columns: minmax(0, 1fr); }
  }
  .pbtn {
    position: relative; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; min-height: 64px;
  }
  .pbtn:active { transform: scale(.97); }
  .pbtn.flash { border-color: var(--ok); background: rgba(34,197,94,.18); }
  .pbtn .tile { width: 38px; height: 38px; font-size: 19px; }
  .pbtn .n { font-weight: 600; line-height: 1.2; }
  .pbtn .p { color: var(--muted); font-size: 13px; }
  .pbtn .badge {
    position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px;
    background: var(--accent); color: var(--dv-ink); font-weight: 700; font-size: 13px; display: grid; place-items: center;
  }
  .pbtn.libera { border-style: dashed; color: var(--muted); justify-content: center; }

  /* Finestre */
  .overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(2,12,15,.72);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity .15s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .box {
    background: var(--dv-deep); border: 1.5px solid var(--accent); border-radius: 22px;
    outline: 1px solid var(--line); outline-offset: 4px;
    width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .box.small { width: min(420px, 100%); }
  .close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--accent); font-size: 20px; }
  .dlg { padding: 22px; }
  .dlg h3 { margin: 0 0 8px; font-size: 21px; }
  .dlg p { color: var(--muted); line-height: 1.45; margin: 0 0 8px; }
  .dlg label { display: block; font-size: 14px; color: var(--muted); margin-top: 14px; }
  .dlg input {
    display: block; width: 100%; margin-top: 6px; padding: 14px; font-size: 18px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--dv-ink); color: var(--text); outline: none;
  }
  .dlg input:focus { border-color: var(--accent); }
  .dlg .err { color: var(--danger); min-height: 20px; margin-top: 8px; }
  .dlg-actions { display: flex; gap: 10px; margin-top: 16px; }
  .dlg-actions .btn { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 60;
    transform: translate(-50%, 20px); opacity: 0; transition: all .2s ease; pointer-events: none;
    background: var(--ok); color: #052e16; font-weight: 700; padding: 14px 22px; border-radius: 14px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body class="dv-bg">
  <div class="top">
    <div class="brand" id="brand"></div>
    <nav class="tabs">
      <a href="#ricette" id="tabRicette">Ricette</a>
      <a href="#tavoli" id="tabTavoli">Tavoli</a>
    </nav>
  </div>
  <main id="app"></main>

  <div class="overlay" id="overlay"><div class="box" id="box"></div></div>
  <div class="toast" id="toast"></div>

<script src="../shared/drinks.js"></script>
<script>
(function () {
  const D = window.DEJAVU;
  const KEY = "dejavu.staff.tavoli.v1";
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });
  const euro = (cent) => fmt.format(cent / 100);
  const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const drinkById = (id) => D.drinks.find((d) => d.id === id);
  const catNome = (id) => (D.categorie.find((c) => c.id === id) || {}).nome || "";

  $("#brand").innerHTML = `<img src="${esc(D.bar.logo)}" alt=""><span class="dv-caps">Staff</span>`;
  document.title = `${D.bar.nome} · Staff`;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* ---------- Dati tavoli (salvati nel browser) ---------- */
  let tavoli = carica();
  function carica() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function salva() {
    try { localStorage.setItem(KEY, JSON.stringify(tavoli)); }
    catch { alert("Attenzione: impossibile salvare i dati sul dispositivo."); }
  }
  const tavoloById = (id) => tavoli.find((t) => t.id === id);
  const totale = (t) => t.righe.reduce((s, r) => s + r.qty * r.prezzoCent, 0);
  const pezzi = (t) => t.righe.reduce((s, r) => s + r.qty, 0);

  window.addEventListener("storage", (e) => {
    if (e.key === KEY) { tavoli = carica(); render(); }
  });

  /* ---------- Stato interfaccia ---------- */
  const ui = {
    ricQ: "", ricCat: "tutti",
    pickQ: "", pickCat: "tutti",
    pane: "ordine", // su telefono: "ordine" oppure "aggiungi"
    pagamento: null, // { id: tavoloId, sel: { rigaId: quantità } }
  };

  const visual = (d) => (d && d.img ? `background-image:url('${esc(d.img)}')` : "");
  const tileHtml = (d) => `<div class="tile dv-ring" style="${visual(d)}">${d && d.img ? "" : esc((d && d.emoji) || "🧾")}</div>`;

  function filtra(q, cat) {
    const nq = norm(q.trim());
    return D.drinks.filter((d) => {
      if (nq) return norm(d.nome + " " + d.ingredienti.map((i) => i.nome).join(" ")).includes(nq);
      return cat === "tutti" || d.categoria === cat;
    });
  }
  function chipsHtml(sel, action) {
    const cats = [{ id: "tutti", nome: "Tutti" }, ...D.categorie];
    return cats.map((c) => `<button class="chip ${c.id === sel ? "on" : ""}" data-action="${action}" data-cat="${esc(c.id)}">${esc(c.nome)}</button>`).join("");
  }

  /* ---------- Routing ---------- */
  function route() {
    const h = location.hash.slice(1);
    if (h.startsWith("tavolo/")) return { view: "tavolo", id: decodeURIComponent(h.slice(7)) };
    if (h === "ricette") return { view: "ricette" };
    return { view: "tavoli" };
  }
  function paneIniziale() {
    const r = route();
    const t = r.view === "tavolo" && tavoloById(r.id);
    ui.pane = t && !t.righe.length ? "aggiungi" : "ordine";
  }
  window.addEventListener("hashchange", () => { ui.pagamento = null; ui.pickQ = ""; paneIniziale(); render(); window.scrollTo(0, 0); });

  function render() {
    const r = route();
    $("#tabRicette").classList.toggle("on", r.view === "ricette");
    $("#tabTavoli").classList.toggle("on", r.view !== "ricette");
    if (r.view === "ricette") return viewRicette();
    if (r.view === "tavolo") {
      const t = tavoloById(r.id);
      if (!t) { location.replace("#tavoli"); return viewTavoli(); }
      return viewTavolo(t);
    }
    viewTavoli();
  }

  /* ---------- Ricette ---------- */
  function viewRicette() {
    $("#app").innerHTML = `
      <input class="search" id="ricQ" type="search" placeholder="Cerca drink o ingrediente…" value="${esc(ui.ricQ)}" autocomplete="off">
      <div class="chips" id="ricChips"></div>
      <div class="rgrid" id="ricLista"></div>`;
    $("#ricQ").addEventListener("input", (e) => { ui.ricQ = e.target.value; listaRicette(); });
    listaRicette();
  }
  function listaRicette() {
    $("#ricChips").innerHTML = chipsHtml(ui.ricQ.trim() ? "" : ui.ricCat, "ric-cat");
    const items = filtra(ui.ricQ, ui.ricCat);
    $("#ricLista").innerHTML = items.length
      ? items.map((d) => `
        <button class="rcard" data-action="apri-ricetta" data-id="${esc(d.id)}">
          ${tileHtml(d)}
          <div><div class="n">${esc(d.nome)}</div><div class="s">${esc(d.metodo || "")}${d.bicchiere ? " · " + esc(d.bicchiere) : ""}</div></div>
        </button>`).join("")
      : `<div class="empty">Nessun drink trovato.</div>`;
  }
  function apriRicetta(id) {
    const d = drinkById(id);
    if (!d) return;
    const meta = [["Bicchiere", d.bicchiere], ["Ghiaccio", d.ghiaccio], ["Metodo", d.metodo], ["Guarnizione", d.guarnizione]]
      .filter(([, v]) => v).map(([k, v]) => `<div><b>${k}</b>${esc(v)}</div>`).join("");
    apriFinestra(`
      <div class="ric-head">
        <div class="dv-ring" style="${visual(d)}">${d.img ? "" : esc(d.emoji || "🍸")}</div>
        <button class="close" data-action="chiudi-finestra" aria-label="Chiudi">✕</button>
      </div>
      <div class="ric-body">
        <h3><span>${esc(d.nome)}</span><span class="p">${euro(Math.round(d.prezzo * 100))}</span></h3>
        <div class="dv-caps" style="text-align:center;font-size:12px;margin-top:6px">${esc(catNome(d.categoria))}</div>
        <div class="meta">${meta}</div>
        <h4>Ingredienti</h4>
        <table class="ingr">${d.ingredienti.map((i) => `<tr><td>${esc(i.nome)}</td><td>${esc(i.dose || "")}</td></tr>`).join("")}</table>
        ${d.passaggi && d.passaggi.length ? `<h4>Procedimento</h4><ol class="steps">${d.passaggi.map((p) => `<li>${esc(p)}</li>`).join("")}</ol>` : ""}
        ${d.note ? `<div class="nota">💡 ${esc(d.note)}</div>` : ""}
      </div>`);
  }

  /* ---------- Lista tavoli ---------- */
  function tempo(ts) {
    const min = Math.floor((Date.now() - ts) / 60000);
    const ora = new Date(ts).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
    const da = min < 1 ? "adesso" : min < 60 ? `da ${min} min` : `da ${Math.floor(min / 60)} h ${min % 60} min`;
    return `aperto alle ${ora} · ${da}`;
  }
  function viewTavoli() {
    const aperti = tavoli.reduce((s, t) => s + totale(t), 0);
    $("#app").innerHTML = `
      <div class="bar-row">
        <h2>Tavoli aperti</h2>
        <span class="sub">${tavoli.length ? `${tavoli.length} · ${euro(aperti)} da incassare` : ""}</span>
        <button class="btn primary" data-action="nuovo-tavolo">+ Nuovo tavolo</button>
      </div>
      ${tavoli.length
        ? `<div class="tgrid">${tavoli.map((t) => `
            <button class="tcard" data-action="apri-tavolo" data-id="${esc(t.id)}">
              <div class="n">${esc(t.nome)}</div>
              <div class="i">${pezzi(t)} ${pezzi(t) === 1 ? "articolo" : "articoli"}</div>
              <div class="i">${tempo(t.creato)}</div>
              <div class="t">${euro(totale(t))}</div>
            </button>`).join("")}</div>`
        : `<div class="empty"><div class="big">🪑</div>Nessun tavolo aperto.<br>Premi <b>+ Nuovo tavolo</b> quando arriva qualcuno.</div>`}`;
  }

  async function nuovoTavolo() {
    const v = await chiedi({
      titolo: "Nuovo tavolo",
      campi: [{ name: "nome", label: "Nome del tavolo", placeholder: "es. Tavolo 4, Divanetto, Esterno 2…" }],
      ok: "Crea tavolo",
      valida: (v) => validaNome(v.nome),
    });
    if (!v) return;
    const t = { id: uid(), nome: v.nome.trim(), creato: Date.now(), righe: [] };
    tavoli.push(t);
    salva();
    location.hash = "#tavolo/" + encodeURIComponent(t.id);
  }
  function validaNome(nome, escludiId) {
    const n = (nome || "").trim();
    if (!n) return "Scrivi un nome.";
    if (tavoli.some((t) => t.id !== escludiId && norm(t.nome) === norm(n))) return "Esiste già un tavolo aperto con questo nome.";
  }

  /* ---------- Dettaglio tavolo ---------- */
  function viewTavolo(t) {
    $("#app").innerHTML = `
      <div class="thead">
        <a class="btn" href="#tavoli" style="text-decoration:none;display:inline-flex;align-items:center;color:var(--accent)">‹ Tavoli</a>
        <h2 id="tNome">${esc(t.nome)}</h2>
        <button class="icon-btn" data-action="rinomina" aria-label="Rinomina">✎</button>
        <div class="since" id="tSince">${tempo(t.creato)}</div>
      </div>
      <div class="mtabs">
        <button data-action="pane" data-pane="ordine" id="mtOrdine"></button>
        <button data-action="pane" data-pane="aggiungi" id="mtAggiungi">+ Aggiungi</button>
      </div>
      <div class="tlayout" id="tlayout">
        <div class="panel ordine" id="ordine"></div>
        <div class="panel picker" id="picker">
          <input class="search" id="pickQ" type="search" placeholder="Aggiungi: cerca drink…" value="${esc(ui.pickQ)}" autocomplete="off">
          <div class="chips" id="pickChips"></div>
          <div class="plist" id="pickLista"></div>
        </div>
      </div>`;
    $("#pickQ").addEventListener("input", (e) => { ui.pickQ = e.target.value; listaPicker(t); });
    aggiornaTavolo(t);
  }

  function aggiornaTavolo(t) {
    const pay = ui.pagamento && ui.pagamento.id === t.id ? ui.pagamento.sel : null;
    const tot = totale(t);
    let righe;
    if (!t.righe.length) {
      righe = `<div class="empty"><div class="big">🍸</div>Nessun ordine.<br>Aggiungi i drink dall'elenco${matchMedia("(min-width:900px)").matches ? " a destra" : " qui sotto"}.</div>`;
    } else {
      righe = t.righe.map((r) => {
        const d = r.drinkId && drinkById(r.drinkId);
        const nome = d
          ? `<button class="nome link" data-action="apri-ricetta" data-id="${esc(d.id)}">${esc(r.nome)}</button>`
          : `<div class="nome">${esc(r.nome)}</div>`;
        const step = pay
          ? `<div class="step pay">
               <button data-action="pay-dec" data-riga="${r.id}" aria-label="Meno">−</button>
               <span>${pay[r.id] || 0}/${r.qty}</span>
               <button data-action="pay-inc" data-riga="${r.id}" aria-label="Più">+</button>
             </div>
             <button class="mini" data-action="pay-riga" data-riga="${r.id}">tutti</button>`
          : `<div class="step">
               <button data-action="dec" data-riga="${r.id}" aria-label="Togli uno">−</button>
               <span>${r.qty}</span>
               <button data-action="inc" data-riga="${r.id}" aria-label="Aggiungi uno">+</button>
             </div>`;
        const lineTot = pay ? (pay[r.id] || 0) * r.prezzoCent : r.qty * r.prezzoCent;
        return `<div class="riga">
            <div class="info">${nome}<div class="cad">${euro(r.prezzoCent)} cad.</div></div>
            ${step}
            <div class="tot">${euro(lineTot)}</div>
          </div>`;
      }).join("");
    }

    let fondo;
    if (pay) {
      const sel = t.righe.reduce((s, r) => s + (pay[r.id] || 0) * r.prezzoCent, 0);
      fondo = `
        <div class="totale pay"><span>Da incassare ora</span><span class="v">${euro(sel)}</span></div>
        <div class="paga-banner">Seleziona cosa paga questa persona. Resteranno da pagare <b>${euro(tot - sel)}</b>.</div>
        <div class="azioni">
          <button class="btn" data-action="pay-annulla">Annulla</button>
          <button class="btn" data-action="pay-tutto">Seleziona tutto</button>
          <button class="btn ok" data-action="pay-conferma" ${sel ? "" : "disabled"}>Incassa ${euro(sel)}</button>
        </div>`;
    } else {
      fondo = `
        <div class="totale"><span>Totale</span><span class="v">${euro(tot)}</span></div>
        <div class="azioni">
          <button class="btn primary" data-action="paga-separato" ${t.righe.length ? "" : "disabled"}>Paga separato</button>
          <button class="btn danger" data-action="chiudi-tavolo">Chiudi tavolo</button>
        </div>`;
    }
    $("#ordine").innerHTML = `<div class="righe">${righe}</div>${fondo}`;
    $("#picker").classList.toggle("off", !!pay);
    if (pay) ui.pane = "ordine";
    $("#tlayout").dataset.pane = ui.pane;
    $("#mtOrdine").classList.toggle("on", ui.pane === "ordine");
    $("#mtAggiungi").classList.toggle("on", ui.pane === "aggiungi");
    $("#mtOrdine").textContent = `Ordine (${pezzi(t)}) · ${euro(tot)}`;
    $("#mtAggiungi").disabled = !!pay;
    listaPicker(t);
  }

  function listaPicker(t) {
    $("#pickChips").innerHTML = chipsHtml(ui.pickQ.trim() ? "" : ui.pickCat, "pick-cat");
    const contati = {};
    t.righe.forEach((r) => { if (r.drinkId) contati[r.drinkId] = (contati[r.drinkId] || 0) + r.qty; });
    const items = filtra(ui.pickQ, ui.pickCat);
    $("#pickLista").innerHTML =
      items.map((d) => `
        <button class="pbtn" data-action="aggiungi" data-id="${esc(d.id)}">
          ${tileHtml(d)}
          <div><div class="n">${esc(d.nome)}</div><div class="p">${euro(Math.round(d.prezzo * 100))}</div></div>
          ${contati[d.id] ? `<span class="badge">${contati[d.id]}</span>` : ""}
        </button>`).join("") +
      `<button class="pbtn libera" data-action="voce-libera">+ Voce libera</button>`;
  }

  function aggiungiRiga(t, { drinkId = null, nome, prezzoCent }) {
    const r = t.righe.find((x) => x.drinkId === drinkId && x.nome === nome && x.prezzoCent === prezzoCent);
    if (r) r.qty++;
    else t.righe.push({ id: uid(), drinkId, nome, prezzoCent, qty: 1 });
    salva();
    aggiornaTavolo(t);
  }

  /* ---------- Finestre (dialoghi) ---------- */
  let risolvi = null;
  function apriFinestra(html, small) {
    if (risolvi) { const r = risolvi; risolvi = null; r(null); }
    $("#box").className = "box" + (small ? " small" : "");
    $("#box").style.position = "relative";
    $("#box").innerHTML = html;
    $("#box").scrollTop = 0;
    $("#overlay").classList.add("open");
  }
  function chiudiFinestra(valore = null) {
    $("#overlay").classList.remove("open");
    const r = risolvi; risolvi = null;
    if (r) r(valore);
  }
  function conferma({ titolo, testo, ok = "Conferma", pericolo = false }) {
    apriFinestra(`
      <div class="dlg">
        <h3>${esc(titolo)}</h3>
        <p>${testo}</p>
        <div class="dlg-actions">
          <button class="btn" data-action="chiudi-finestra">Annulla</button>
          <button class="btn ${pericolo ? "danger fill" : "primary"}" data-action="finestra-ok">${esc(ok)}</button>
        </div>
      </div>`, true);
    return new Promise((res) => (risolvi = res));
  }
  function chiedi({ titolo, campi, ok = "OK", valida }) {
    apriFinestra(`
      <form class="dlg" id="dlgForm" autocomplete="off">
        <h3>${esc(titolo)}</h3>
        ${campi.map((c) => `<label>${esc(c.label)}<input name="${c.name}" value="${esc(c.value || "")}" placeholder="${esc(c.placeholder || "")}" ${c.inputmode ? `inputmode="${c.inputmode}"` : ""}></label>`).join("")}
        <div class="err" id="dlgErr"></div>
        <div class="dlg-actions">
          <button type="button" class="btn" data-action="chiudi-finestra">Annulla</button>
          <button type="submit" class="btn primary">${esc(ok)}</button>
        </div>
      </form>`, true);
    const form = $("#dlgForm");
    const primo = form.querySelector("input");
    primo.focus();
    primo.select();
    return new Promise((res) => {
      risolvi = res;
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const v = Object.fromEntries(new FormData(form));
        const err = valida && valida(v);
        if (err) { $("#dlgErr").textContent = err; return; }
        chiudiFinestra(v);
      });
    });
  }
  $("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") chiudiFinestra(null); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") chiudiFinestra(null); });

  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  /* ---------- Azioni ---------- */
  document.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-action]");
    if (!b) return;
    const a = b.dataset.action;
    const r = route();
    const t = r.view === "tavolo" ? tavoloById(r.id) : null;
    const riga = t && b.dataset.riga ? t.righe.find((x) => x.id === b.dataset.riga) : null;
    const pay = ui.pagamento && t && ui.pagamento.id === t.id ? ui.pagamento.sel : null;

    switch (a) {
      case "chiudi-finestra": return chiudiFinestra(null);
      case "finestra-ok": return chiudiFinestra(true);
      case "ric-cat": ui.ricCat = b.dataset.cat; ui.ricQ = ""; $("#ricQ").value = ""; return listaRicette();
      case "apri-ricetta": return apriRicetta(b.dataset.id);
      case "nuovo-tavolo": return nuovoTavolo();
      case "apri-tavolo": location.hash = "#tavolo/" + encodeURIComponent(b.dataset.id); return;
    }
    if (!t) return;

    switch (a) {
      case "pick-cat":
        ui.pickCat = b.dataset.cat; ui.pickQ = ""; $("#pickQ").value = "";
        return listaPicker(t);

      case "aggiungi": {
        const d = drinkById(b.dataset.id);
        if (!d) return;
        aggiungiRiga(t, { drinkId: d.id, nome: d.nome, prezzoCent: Math.round(d.prezzo * 100) });
        const nb = document.querySelector(`.pbtn[data-id="${CSS.escape(d.id)}"]`);
        if (nb) { nb.classList.add("flash"); setTimeout(() => nb.classList.remove("flash"), 250); }
        return;
      }

      case "voce-libera": {
        const v = await chiedi({
          titolo: "Voce libera",
          campi: [
            { name: "nome", label: "Descrizione", placeholder: "es. Patatine, Shot, Acqua…" },
            { name: "prezzo", label: "Prezzo (€)", placeholder: "es. 3,50", inputmode: "decimal" },
          ],
          ok: "Aggiungi",
          valida: (v) => {
            if (!v.nome.trim()) return "Scrivi una descrizione.";
            const p = parseFloat(v.prezzo.replace(",", "."));
            if (!(p >= 0)) return "Prezzo non valido.";
          },
        });
        if (!v) return;
        return aggiungiRiga(t, { nome: v.nome.trim(), prezzoCent: Math.round(parseFloat(v.prezzo.replace(",", ".")) * 100) });
      }

      case "inc": if (riga) { riga.qty++; salva(); aggiornaTavolo(t); } return;
      case "dec":
        if (!riga) return;
        riga.qty--;
        if (riga.qty <= 0) t.righe = t.righe.filter((x) => x !== riga);
        salva(); aggiornaTavolo(t);
        return;

      case "rinomina": {
        const v = await chiedi({
          titolo: "Rinomina tavolo",
          campi: [{ name: "nome", label: "Nome del tavolo", value: t.nome }],
          ok: "Salva",
          valida: (v) => validaNome(v.nome, t.id),
        });
        if (!v) return;
        t.nome = v.nome.trim(); salva();
        $("#tNome").textContent = t.nome;
        return;
      }

      case "pane":
        ui.pane = b.dataset.pane; aggiornaTavolo(t); window.scrollTo(0, 0);
        return;

      case "paga-separato": ui.pagamento = { id: t.id, sel: {} }; return aggiornaTavolo(t);
      case "pay-annulla": ui.pagamento = null; return aggiornaTavolo(t);
      case "pay-inc": if (pay && riga) { pay[riga.id] = Math.min(riga.qty, (pay[riga.id] || 0) + 1); aggiornaTavolo(t); } return;
      case "pay-dec": if (pay && riga) { pay[riga.id] = Math.max(0, (pay[riga.id] || 0) - 1); aggiornaTavolo(t); } return;
      case "pay-riga": if (pay && riga) { pay[riga.id] = pay[riga.id] === riga.qty ? 0 : riga.qty; aggiornaTavolo(t); } return;
      case "pay-tutto": if (pay) { t.righe.forEach((x) => (pay[x.id] = x.qty)); aggiornaTavolo(t); } return;

      case "pay-conferma": {
        if (!pay) return;
        const incassato = t.righe.reduce((s, x) => s + (pay[x.id] || 0) * x.prezzoCent, 0);
        t.righe.forEach((x) => (x.qty -= pay[x.id] || 0));
        t.righe = t.righe.filter((x) => x.qty > 0);
        ui.pagamento = null;
        salva(); aggiornaTavolo(t);
        toast(`Incassati ${euro(incassato)}`);
        if (!t.righe.length) {
          const ok = await conferma({ titolo: "Tavolo saldato", testo: `<b>${esc(t.nome)}</b> ha pagato tutto. Vuoi chiudere il tavolo?`, ok: "Chiudi tavolo" });
          if (ok) eliminaTavolo(t);
        }
        return;
      }

      case "chiudi-tavolo": {
        const tot = totale(t);
        const ok = await conferma({
          titolo: `Chiudere «${t.nome}»?`,
          testo: tot
            ? `Il tavolo verrà eliminato con tutti gli ordini.<br>Totale da incassare: <b style="color:var(--text)">${euro(tot)}</b>`
            : "Il tavolo verrà eliminato.",
          ok: tot ? `Pagato ${euro(tot)} · Chiudi` : "Chiudi tavolo",
          pericolo: true,
        });
        if (ok) eliminaTavolo(t);
        return;
      }
    }
  });

  function eliminaTavolo(t) {
    tavoli = tavoli.filter((x) => x.id !== t.id);
    salva();
    toast(`Tavolo «${t.nome}» chiuso`);
    location.hash = "#tavoli";
  }

  // Aggiorna i tempi "aperto da…" ogni 30 secondi
  setInterval(() => {
    const r = route();
    if (r.view === "tavoli" && !$("#overlay").classList.contains("open")) viewTavoli();
    if (r.view === "tavolo") { const t = tavoloById(r.id); const el = $("#tSince"); if (t && el) el.textContent = tempo(t.creato); }
  }, 30000);

  paneIniziale();
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
