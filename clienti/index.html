<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Déjà Vu · Menu</title>
<meta name="theme-color" content="#0b2428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Déjà Vu Menu">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="../shared/brand.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; color: var(--dv-text); }
  body {
    font-family: var(--dv-font);
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none;
  }

  header { text-align: center; padding: 32px 16px 18px; }
  header img {
    width: clamp(170px, 30vw, 250px); height: auto; display: block; margin: 0 auto;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.45)) drop-shadow(0 0 24px rgba(81,199,227,.15));
  }
  header p { margin: 16px 0 0; font-size: 12px; }

  nav {
    position: sticky; top: 0; z-index: 5;
    background: rgba(8, 30, 35, .88);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--dv-tq-line); border-bottom: 1px solid var(--dv-tq-line);
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; justify-content: safe center; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1.5px solid var(--dv-tq-line); background: transparent; color: var(--dv-tq);
    padding: 10px 18px; border-radius: 999px; font: 600 14px var(--dv-font); letter-spacing: .04em; cursor: pointer;
  }
  .chip.on { background: var(--dv-tq); color: var(--dv-ink); border-color: var(--dv-tq); }

  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 40px; }
  section h2 {
    font-size: 15px; margin: 40px 0 22px; text-align: center;
    display: flex; align-items: center; gap: 16px;
  }
  /* doppia linea, come il doppio anello del logo */
  section h2::before, section h2::after {
    content: ""; flex: 1; height: 5px;
    border-top: 1.5px solid var(--dv-tq); border-bottom: 1px solid var(--dv-tq-line);
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
  .card {
    background: rgba(6, 27, 32, .45); border: 1px solid var(--dv-tq-line); border-radius: 24px;
    padding: 26px 16px 20px; cursor: pointer; color: inherit; font: inherit; text-align: center;
    display: flex; flex-direction: column; align-items: center; transition: transform .15s ease, border-color .15s;
  }
  .card:active { transform: scale(.97); border-color: var(--dv-tq); }
  .card .dv-ring { width: 120px; height: 120px; display: grid; place-items: center; font-size: 54px; }
  .card .name { font-size: 18px; font-weight: 700; margin: 22px 0 0; line-height: 1.25; }
  .price { color: var(--dv-tq); font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .price { margin-top: 6px; font-size: 15px; }
  .card .ingr { color: var(--dv-muted); font-size: 13px; margin: 8px 0 0; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (max-width: 560px) {
    main { padding: 4px 12px 32px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card { padding: 18px 10px 14px; border-radius: 20px; }
    .card .dv-ring { width: 84px; height: 84px; font-size: 38px; }
    .card .name { font-size: 15px; margin-top: 16px; }
    .card .price { font-size: 14px; }
    .card .ingr { font-size: 12px; }
    section h2 { font-size: 13px; margin: 28px 0 16px; gap: 10px; }
    header { padding: 24px 16px 14px; }
    header p { font-size: 10px; letter-spacing: .14em; }
    .sheet { padding: 32px 18px calc(28px + env(safe-area-inset-bottom)); }
    .sheet .dv-ring { width: 150px; height: 150px; font-size: 70px; }
    .sheet h3 { font-size: 26px; }
  }

  /* Dettaglio */
  .overlay {
    position: fixed; inset: 0; background: rgba(2, 12, 15, .7); z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    width: min(600px, 100%); max-height: 92vh; overflow-y: auto; position: relative;
    border-radius: 28px 28px 0 0; border: 1.5px solid var(--dv-tq); border-bottom: none;
    outline: 1px solid var(--dv-tq-line); outline-offset: 4px;
    transform: translateY(40px); transition: transform .25s ease;
    padding: 40px 26px calc(32px + env(safe-area-inset-bottom)); text-align: center;
  }
  .overlay.open .sheet { transform: none; }
  @media (min-width: 700px) {
    .overlay { align-items: center; }
    .sheet { border-radius: 28px; border-bottom: 1.5px solid var(--dv-tq); }
  }
  .sheet .dv-ring { width: 190px; height: 190px; margin: 0 auto; display: grid; place-items: center; font-size: 88px; }
  .close {
    position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--dv-tq-line); background: transparent; color: var(--dv-tq); font-size: 20px; cursor: pointer;
  }
  .sheet h3 { margin: 28px 0 4px; font-size: 30px; font-weight: 700; }
  .sheet .price { font-size: 20px; }
  .sheet .desc { line-height: 1.6; font-size: 17px; margin: 16px 0 26px; color: var(--dv-text); opacity: .9; }
  .label { font-size: 12px; margin-bottom: 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tag { border: 1.5px solid var(--dv-tq-line); border-radius: 999px; padding: 8px 14px; font-size: 15px; background: var(--dv-tq-soft); }

  footer { text-align: center; color: var(--dv-muted); font-size: 12px; padding: 8px 16px 36px; line-height: 1.8; }
</style>
</head>
<body class="dv-bg">
  <header>
    <img id="logo" alt="">
    <p class="dv-caps" id="luogo"></p>
  </header>
  <nav><div class="chips" id="chips"></div></nav>
  <main id="menu"></main>
  <footer>Per allergie o intolleranze chiedi al personale.</footer>

  <div class="overlay" id="overlay">
    <div class="sheet dv-bg" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

<script src="../shared/drinks.js"></script>
<script>
(function () {
  const D = window.DEJAVU;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const euro = (n) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n);
  const prezzo = (d) => (D.mostraPrezziClienti && d.prezzo != null ? `<div class="price">${euro(d.prezzo)}</div>` : "");
  const badge = (d) => `<div class="dv-ring" ${d.img ? `style="background-image:url('${esc(d.img)}')"` : ""}>${d.img ? "" : esc(d.emoji || "🍸")}</div>`;

  $("#logo").src = D.bar.logo;
  $("#logo").alt = D.bar.nome;
  $("#luogo").textContent = D.bar.luogo || D.bar.sottotitolo || "";
  document.title = `${D.bar.nome} · Menu`;

  let filtro = "tutti";

  function renderChips() {
    const cats = [{ id: "tutti", nome: "Tutto" }, ...D.categorie.filter((c) => D.drinks.some((d) => d.categoria === c.id))];
    $("#chips").innerHTML = cats
      .map((c) => `<button class="chip ${c.id === filtro ? "on" : ""}" data-cat="${esc(c.id)}">${esc(c.nome)}</button>`)
      .join("");
  }

  function renderMenu() {
    const cats = D.categorie.filter((c) => filtro === "tutti" || c.id === filtro);
    $("#menu").innerHTML = cats
      .map((c) => {
        const items = D.drinks.filter((d) => d.categoria === c.id);
        if (!items.length) return "";
        return `<section><h2 class="dv-caps">${esc(c.nome)}</h2><div class="grid">${items
          .map(
            (d) => `<button class="card" data-id="${esc(d.id)}">
              ${badge(d)}
              <p class="name">${esc(d.nome)}</p>
              ${prezzo(d)}
              <p class="ingr">${esc(d.ingredienti.map((i) => i.nome).join(" · "))}</p>
            </button>`
          )
          .join("")}</div></section>`;
      })
      .join("");
  }

  function apri(id) {
    const d = D.drinks.find((x) => x.id === id);
    if (!d) return;
    $("#sheet").innerHTML = `
      <button class="close" data-close aria-label="Chiudi">✕</button>
      ${badge(d)}
      <h3>${esc(d.nome)}</h3>
      ${prezzo(d)}
      <p class="desc">${esc(d.descrizione)}</p>
      <div class="label dv-caps">Ingredienti</div>
      <div class="tags">${d.ingredienti.map((i) => `<span class="tag">${esc(i.nome)}</span>`).join("")}</div>`;
    $("#sheet").scrollTop = 0;
    $("#overlay").classList.add("open");
  }
  const chiudi = () => $("#overlay").classList.remove("open");

  $("#chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    filtro = b.dataset.cat;
    renderChips();
    renderMenu();
    window.scrollTo({ top: $("nav").offsetTop, behavior: "smooth" });
  });
  $("#menu").addEventListener("click", (e) => {
    const c = e.target.closest("[data-id]");
    if (c) apri(c.dataset.id);
  });
  $("#overlay").addEventListener("click", (e) => {
    if (e.target.id === "overlay" || e.target.closest("[data-close]")) chiudi();
  });
  document.addEventListener("keydown", (e) => e.key === "Escape" && chiudi());

  renderChips();
  renderMenu();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
